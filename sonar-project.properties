sonar.projectKey=Chemsorly_coding-agent-automation
sonar.organization=chemsorly

# ── Exclude from all analysis (bugs + coverage) ──────────────────────────────
# EF Core auto-generated migration DDL — no logic, never exercised in unit tests
# Test utility library — test helpers should not be analysed as production code
sonar.exclusions=\
  **/Migrations/**,\
  tests/CodingAgentWebUI.TestUtilities/**

# ── Exclude from coverage only (still analysed for bugs/smells) ──────────────
# Program.cs entry points — DI wiring, not unit-testable by design
# Blazor component markup files — only reachable via E2E (Playwright); no unit-test path
sonar.coverage.exclusions=\
  **/Program.cs,\
  **/*.razor
