name: E2E Tests

on:
  # Re-enabled by Spec 045 (same branch) — restores triggers disabled by Spec 041 Task 2.1.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A test process runs one test at a time (the factories share process-global environment
  # variables), so the suite is split across separate jobs, and each job runs two test processes
  # side by side: every process has its own hosts on free ports and its own temp folder. The shard
  # count is the length of the matrix; a second process per shard uses the runner's idle cores
  # without paying the job's fixed setup (container, SDK, restore, build) again (spec 052 V7).
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.63.0-noble

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        shell: sh
        run: |
          curl -sSL --proto '=https' --tlsv1.2 https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --install-dir /usr/share/dotnet --channel 10.0
          rm /tmp/dotnet-install.sh
          dotnet --version

      - name: Restore
        run: dotnet restore tests/CodingAgent.Web.E2ETests/CodingAgent.Web.E2ETests.csproj

      # -p:IsTestProject=true so the test host and adapters are copied to the output. The csproj
      # keeps the property false so ci.yml's solution-wide `dotnet test` does not pick this
      # project up and fail on "no tests match Category!=E2E". See the csproj for the full note.
      #
      # Faster than the defaults, which suit a dev machine: the compiler server (Directory.Build.props
      # turns it off so no VBCSCompiler outlives a local build; the job container is thrown away) and no
      # analyzers (ci.yml's Release build enforces them with TreatWarningsAsErrors). About a third less
      # build time per shard, measured locally (spec 052 V7).
      - name: Build
        run: dotnet build tests/CodingAgent.Web.E2ETests/ -c Debug -p:IsTestProject=true -p:UseSharedCompilation=true -p:RunAnalyzers=false

      # The sorted list of E2E test methods is dealt round-robin across the shards, so browser
      # and headless tests spread evenly and a new test class needs no shard assignment. Every
      # shard lists the same build, so the shards are disjoint and together run the whole suite.
      # Splitting a class across shards is safe: every test resets the shared fixture first.
      # The filter grows by about 125 bytes per test; Linux caps a single argument at 128 KB.
      - name: Select shard tests
        run: |
          dotnet vstest tests/CodingAgent.Web.E2ETests/bin/Debug/net10.0/CodingAgent.Web.E2ETests.dll --TestCaseFilter:"Category=E2E" --ListFullyQualifiedTests --ListTestsTargetPath:"$RUNNER_TEMP/e2e-listed.txt"
          LC_ALL=C sort -u "$RUNNER_TEMP/e2e-listed.txt" | awk 'NF' > "$RUNNER_TEMP/e2e-all.txt"
          awk -v total="${{ strategy.job-total }}" -v shard="${{ strategy.job-index }}" '(NR - 1) % total == shard' "$RUNNER_TEMP/e2e-all.txt" > "$RUNNER_TEMP/e2e-shard.txt"
          ALL=$(wc -l < "$RUNNER_TEMP/e2e-all.txt")
          SELECTED=$(wc -l < "$RUNNER_TEMP/e2e-shard.txt")
          if [ "$SELECTED" -eq 0 ]; then
            echo "::error::Shard ${{ matrix.shard }} selected no tests out of ${ALL} E2E test methods"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/${{ strategy.job-total }}: ${SELECTED} of ${ALL} E2E test methods"
          # Each shard's list is dealt round-robin into the two parallel test processes.
          for part in 0 1; do
            awk -v part="$part" '(NR - 1) % 2 == part' "$RUNNER_TEMP/e2e-shard.txt" > "$RUNNER_TEMP/e2e-part$part.txt"
            echo "E2E_FILTER_$part=Category=E2E&($(sed 's/^/FullyQualifiedName=/' "$RUNNER_TEMP/e2e-part$part.txt" | paste -sd '|' -))" >> "$GITHUB_ENV"
          done

      # vstest against the built DLL, not `dotnet test` on the project: with IsTestProject=false
      # the VSTest MSBuild target is a no-op and `dotnet test` exits 0 having discovered zero
      # tests, which is how this job passed for the whole 041–045 arc without running anything.
      #
      # --Blame hang timeout: a test with no progress for 5 minutes aborts the run and the log
      # names it ("The test running when the crash occurred: ..."). Without it a hung test
      # runs silently into timeout-minutes, GitHub reports the job as cancelled with no test
      # name, and agents fixing E2E tests get nothing to work from.
      #
      # Two processes in parallel, each prefixing its log lines with [0] or [1]. Each gets its own
      # TMPDIR, because the harness writes fixed paths under the temp folder (agent workspaces, MCP
      # config). The step fails if either process fails.
      - name: Run E2E Tests
        shell: bash
        run: |
          set -o pipefail
          run_part() {
            local part=$1 filter=$2
            mkdir -p "$RUNNER_TEMP/tmp-$part"
            TMPDIR="$RUNNER_TEMP/tmp-$part" dotnet vstest tests/CodingAgent.Web.E2ETests/bin/Debug/net10.0/CodingAgent.Web.E2ETests.dll --TestCaseFilter:"$filter" --Blame:"CollectHangDump;HangDumpType=None;TestTimeout=5m" --logger:trx --ResultsDirectory:"TestResults/part$part" 2>&1 | sed -u "s/^/[$part] /"
          }
          run_part 0 "$E2E_FILTER_0" &
          first=$!
          run_part 1 "$E2E_FILTER_1" &
          second=$!
          status=0
          wait "$first" || status=1
          wait "$second" || status=1
          exit "$status"
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: CoverageReport
          reporttypes: MarkdownAssembliesSummary
        if: ${{ always() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}

      - name: Post coverage to PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-e2e
          path: CoverageReport/AssembliesSummary.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('CoverageReport/AssembliesSummary.md') != '' }}

      - name: Write coverage to job summary
        run: cat CoverageReport/AssembliesSummary.md >> $GITHUB_STEP_SUMMARY
        if: ${{ always() && hashFiles('CoverageReport/AssembliesSummary.md') != '' }}

      # TODO: Reactivate on next billing cycle (storage budget exhausted)
      # - name: Upload screenshots
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   if: failure()
      #   with:
      #     name: playwright-screenshots-${{ matrix.shard }}
      #     path: TestResults/screenshots/

      # TODO: Reactivate on next billing cycle (storage budget exhausted)
      # - name: Upload test results
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   if: always()
      #   with:
      #     name: e2e-test-results-${{ matrix.shard }}
      #     path: TestResults/

  # Gate for branch protection: the shards report as "e2e (shard N/M)", and this job keeps the
  # single "e2e" check the suite reported before it was split.
  e2e:
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::E2E shards did not all pass (result: ${{ needs.e2e-shard.result }})"
            exit 1
          fi
