name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.61.0-noble

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        shell: sh
        run: |
          curl -sSL --proto '=https' --tlsv1.2 https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --install-dir /usr/share/dotnet --channel 10.0
          rm /tmp/dotnet-install.sh
          dotnet --version

      - name: Restore
        run: dotnet restore tests/CodingAgentWebUI.E2ETests/CodingAgentWebUI.E2ETests.csproj

      - name: Build
        run: dotnet build tests/CodingAgentWebUI.E2ETests/ -c Debug

      - name: Run E2E Tests
        run: dotnet test tests/CodingAgentWebUI.E2ETests/ -c Debug --no-build --filter "Category=E2E" --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: CoverageReport
          reporttypes: MarkdownAssembliesSummary
        if: ${{ always() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}

      - name: Post coverage to PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-e2e
          path: CoverageReport/AssembliesSummary.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('CoverageReport/AssembliesSummary.md') != '' }}

      - name: Write coverage to job summary
        run: cat CoverageReport/AssembliesSummary.md >> $GITHUB_STEP_SUMMARY
        if: ${{ always() && hashFiles('CoverageReport/AssembliesSummary.md') != '' }}

