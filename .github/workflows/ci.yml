name: CI

on:
  push:
    branches: [main]
    # Strict vX.Y.Z only: the image signing identity below accepts no other tag shape.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keyless cosign identity of every image this workflow pushes. The signing certificate is issued
# by Fulcio for this workflow file on main or a release tag, so verification pins the workflow,
# the ref and the repository. Keep in sync with the "Verify Images" section of docs/deployment.md.
env:
  IMAGE_SIGNER_IDENTITY_REGEXP: '^https://github\.com/Chemsorly/coding-agent-automation/\.github/workflows/ci\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$'
  IMAGE_SIGNER_OIDC_ISSUER: https://token.actions.githubusercontent.com
  IMAGE_SIGNER_REPOSITORY: Chemsorly/coding-agent-automation

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore dependencies
        run: dotnet restore --verbosity quiet

      - name: Build
        run: dotnet build --no-restore --configuration Release --verbosity quiet

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity quiet --logger trx --logger "console;verbosity=minimal" --results-directory TestResults --filter "Category!=E2E&Category!=Integration" --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: CoverageReport
          reporttypes: MarkdownAssembliesSummary
        if: ${{ always() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}

      - name: Post coverage to PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-ci
          path: CoverageReport/Summary.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('CoverageReport/Summary.md') != '' }}

      - name: Write coverage to job summary
        run: cat CoverageReport/Summary.md >> $GITHUB_STEP_SUMMARY
        if: ${{ always() && hashFiles('CoverageReport/Summary.md') != '' }}

      # TODO: Reactivate on next billing cycle (storage budget exhausted)
      # - name: Upload test results
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: test-results
      #     path: TestResults
      #   if: ${{ always() }}

  # Migration integrity — applies all EF migrations from scratch against a real Postgres
  # container (via Testcontainers) and asserts that the compiled model matches the migration
  # snapshot. Catches PendingModelChangesWarning and bad DDL that EF InMemory cannot detect.
  # Runs directly on the runner (no container: wrapper) so Docker is available for Testcontainers.
  # Runs in parallel with build-and-test; does NOT need build-and-test to succeed first.
  migration-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/CodingAgent.Infrastructure.IntegrationTests/CodingAgent.Infrastructure.IntegrationTests.csproj --verbosity quiet

      - name: Build
        run: dotnet build tests/CodingAgent.Infrastructure.IntegrationTests/ --no-restore --configuration Release --verbosity quiet

      - name: Run migration integrity tests
        run: dotnet test tests/CodingAgent.Infrastructure.IntegrationTests/ --no-build --configuration Release --verbosity quiet --logger trx --logger "console;verbosity=minimal" --results-directory TestResults --filter "Category=Integration" --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: CoverageReport
          reporttypes: MarkdownAssembliesSummary
        if: ${{ always() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}

      - name: Post coverage to PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-integration
          path: CoverageReport/AssembliesSummary.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('CoverageReport/AssembliesSummary.md') != '' }}

      - name: Write coverage to job summary
        run: cat CoverageReport/AssembliesSummary.md >> $GITHUB_STEP_SUMMARY
        if: ${{ always() && hashFiles('CoverageReport/AssembliesSummary.md') != '' }}

  # Secret scanning — detect leaked credentials in code
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  # Helm chart validation — runs on ALL branches/PRs to catch chart errors early
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Helm lint
        run: helm lint helm/coding-agent-automation/ -f helm/coding-agent-automation/ci-values.yaml

      - name: Helm template
        run: helm template test-release helm/coding-agent-automation/ -f helm/coding-agent-automation/ci-values.yaml > /dev/null

  # Build every product image on every event, gated on a green build-and-test. A prior
  # Spec 048 Phase 3 path-filter (build only the images whose source changed) was removed
  # in favour of always building all — the build is fast enough that the selective machinery
  # (docker-image-projects.json + detect script + drift-guard test) was not worth its
  # complexity or its failure surface.
  docker-build:
    needs: [build-and-test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    permissions:
      contents: read
      # Keyless cosign signing of the pushed per-arch image (main and release tags only).
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - { dockerfile: dockerfiles/web.Dockerfile, tag: coding-agent-web }
          - { dockerfile: dockerfiles/api.Dockerfile, tag: coding-agent-api }
          - { dockerfile: dockerfiles/jobcontroller.Dockerfile, tag: coding-agent-jobcontroller }
          - { dockerfile: dockerfiles/scheduler.Dockerfile, tag: coding-agent-scheduler }
          - { dockerfile: dockerfiles/kiro/agent-kiro-dotnet10.Dockerfile, tag: coding-agent-kiro-dotnet10 }
          - { dockerfile: dockerfiles/kiro/agent-kiro-python312.Dockerfile, tag: coding-agent-kiro-python312 }
          - { dockerfile: dockerfiles/kiro/agent-kiro-java21.Dockerfile, tag: coding-agent-kiro-java21 }
          - { dockerfile: dockerfiles/opencode/agent-opencode-dotnet10.Dockerfile, tag: coding-agent-opencode-dotnet10 }
          - { dockerfile: dockerfiles/opencode/agent-opencode-java21.Dockerfile, tag: coding-agent-opencode-java21 }
          - { dockerfile: dockerfiles/opencode/agent-opencode-python312.Dockerfile, tag: coding-agent-opencode-python312 }
          - { dockerfile: dockerfiles/claude/agent-claude-dotnet10.Dockerfile, tag: coding-agent-claude-dotnet10 }
          - { dockerfile: dockerfiles/claude/agent-claude-python312.Dockerfile, tag: coding-agent-claude-python312 }
          - { dockerfile: dockerfiles/claude/agent-claude-java21.Dockerfile, tag: coding-agent-claude-java21 }
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and push ${{ matrix.image.tag }} (${{ matrix.arch }})
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Configure registry auth
          AUTH=$(echo -n "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | base64)
          echo "::add-mask::${AUTH}"
          mkdir -p "${XDG_RUNTIME_DIR}/containers"
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"}}}" > "${XDG_RUNTIME_DIR}/containers/auth.json"

          # Build args for build-info (only relevant for web, ignored by other Dockerfiles)
          BUILD_ARGS=""
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_COMMIT_SHA=${{ github.sha }}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_BRANCH=${{ github.ref_name }}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_RUN_ID=${{ github.run_id }}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_RUN_NUMBER=${{ github.run_number }}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_IMAGE_TAG=chemsorly/coding-agent:${{ matrix.image.tag }}-latest"
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}"

          # Build single-arch image natively
          buildah build \
            --platform ${{ matrix.platform }} \
            -f ${{ matrix.image.dockerfile }} \
            -t docker.io/chemsorly/coding-agent:${{ matrix.image.tag }}-${{ matrix.arch }} \
            ${BUILD_ARGS} \
            .

          # Push per-arch image (used by manifest merge job)
          if [ "${{ github.ref }}" = "refs/heads/main" ] || echo "${{ github.ref }}" | grep -q "^refs/tags/v"; then
            buildah push \
              --authfile "${XDG_RUNTIME_DIR}/containers/auth.json" \
              --digestfile "${RUNNER_TEMP}/digest" \
              docker.io/chemsorly/coding-agent:${{ matrix.image.tag }}-${{ matrix.arch }} \
              docker://docker.io/chemsorly/coding-agent:${{ matrix.image.tag }}-${{ matrix.arch }}
          fi

      - name: Install cosign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign the per-arch image by the digest buildah pushed, so the signature cannot attach to
      # a tag that moved in between. The manifest list is signed separately in docker-push.
      - name: Sign ${{ matrix.image.tag }} (${{ matrix.arch }})
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # cosign reads registry auth from the Docker config; the buildah auth file has the same format.
          mkdir -p ~/.docker
          cp "${XDG_RUNTIME_DIR}/containers/auth.json" ~/.docker/config.json

          REF="docker.io/chemsorly/coding-agent@$(cat "${RUNNER_TEMP}/digest")"
          cosign sign --yes "${REF}"

          # The signature is an OCI referrer; retry in case the registry's referrers index lags.
          for ATTEMPT in 1 2 3; do
            if cosign verify \
              --certificate-identity-regexp "${IMAGE_SIGNER_IDENTITY_REGEXP}" \
              --certificate-oidc-issuer "${IMAGE_SIGNER_OIDC_ISSUER}" \
              --certificate-github-workflow-repository "${IMAGE_SIGNER_REPOSITORY}" \
              "${REF}" > /dev/null; then
              exit 0
            fi
            echo "Signature for ${REF} not verifiable yet (attempt ${ATTEMPT}/3)"
            sleep 10
          done
          echo "::error::cosign verify failed for ${REF}"
          exit 1

  # Gate job for branch protection — matrix jobs report as "docker-build (arch, ...)"
  # but branch protection requires a single named check. This aggregates the result.
  docker-build-gate:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - run: |
          # 'skipped' is valid — docker-build is skipped only when build-and-test fails, which
          # is already gated by its own check. Only a real failure/cancellation should gate here.
          if [[ "${{ needs.docker-build.result }}" == "failure" || "${{ needs.docker-build.result }}" == "cancelled" ]]; then
            echo "::error::docker-build matrix failed or was cancelled"
            exit 1
          fi

  docker-push:
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Keyless cosign signing of the pushed manifest list.
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: coding-agent-web }
          - { tag: coding-agent-api }
          - { tag: coding-agent-jobcontroller }
          - { tag: coding-agent-scheduler }
          - { tag: coding-agent-kiro-dotnet10 }
          - { tag: coding-agent-kiro-python312 }
          - { tag: coding-agent-kiro-java21 }
          - { tag: coding-agent-opencode-dotnet10 }
          - { tag: coding-agent-opencode-java21 }
          - { tag: coding-agent-opencode-python312 }
          - { tag: coding-agent-claude-dotnet10 }
          - { tag: coding-agent-claude-python312 }
          - { tag: coding-agent-claude-java21 }

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # The manifest list is pushed to the immutable SHA tag first and signed there. The mutable
      # -latest and -<version> tags are moved only after the signature exists, so a cancelled or
      # failed run never leaves them pointing at an unsigned image.
      - name: Create, sign and push multi-arch manifest for ${{ matrix.tag }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Configure registry auth
          AUTH=$(echo -n "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | base64)
          echo "::add-mask::${AUTH}"
          mkdir -p "${XDG_RUNTIME_DIR}/containers"
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"}}}" > "${XDG_RUNTIME_DIR}/containers/auth.json"
          AUTHFILE="${XDG_RUNTIME_DIR}/containers/auth.json"

          # cosign reads registry auth from the Docker config; the buildah auth file has the same format.
          mkdir -p ~/.docker
          cp "${AUTHFILE}" ~/.docker/config.json

          IMG="docker.io/chemsorly/coding-agent"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # buildah manifest push returns the result of writing --digestfile, not of the push, so a
          # failed push exits 0 with an empty digest file. Treat anything but a digest as a failure.
          push_manifest() {
            buildah manifest push --authfile "${AUTHFILE}" --all \
              --digestfile "${RUNNER_TEMP}/digest" \
              "${IMG}:${{ matrix.tag }}" \
              "docker://${IMG}:$1"
            PUSHED_DIGEST=$(cat "${RUNNER_TEMP}/digest")
            if ! echo "${PUSHED_DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              echo "::error::Push of ${IMG}:$1 failed (digest file: '${PUSHED_DIGEST}')"
              exit 1
            fi
          }

          # --recursive also signs each platform manifest the list references. Those are the same
          # digests as the per-arch tags docker-build already signed; signing them twice is harmless.
          sign_manifest() {
            local REF="${IMG}@$1"
            cosign sign --yes --recursive "${REF}"
            # The signature is an OCI referrer; retry in case the registry's referrers index lags.
            for ATTEMPT in 1 2 3; do
              if cosign verify \
                --certificate-identity-regexp "${IMAGE_SIGNER_IDENTITY_REGEXP}" \
                --certificate-oidc-issuer "${IMAGE_SIGNER_OIDC_ISSUER}" \
                --certificate-github-workflow-repository "${IMAGE_SIGNER_REPOSITORY}" \
                "${REF}" > /dev/null; then
                return 0
              fi
              echo "Signature for ${REF} not verifiable yet (attempt ${ATTEMPT}/3)"
              sleep 10
            done
            echo "::error::cosign verify failed for ${REF}"
            exit 1
          }

          # Pushes of the same local list normally produce the same digest. If one does not, sign it
          # too rather than leave a tag pointing at an unsigned list.
          push_signed_manifest() {
            push_manifest "$1"
            if [ "${PUSHED_DIGEST}" != "${SIGNED_DIGEST}" ]; then
              echo "::warning::${IMG}:$1 has digest ${PUSHED_DIGEST}, not ${SIGNED_DIGEST}; signing it separately"
              sign_manifest "${PUSHED_DIGEST}"
            fi
          }

          # Create manifest from per-arch images
          buildah manifest create "${IMG}:${{ matrix.tag }}"
          buildah manifest add --authfile "${AUTHFILE}" "${IMG}:${{ matrix.tag }}" "docker://${IMG}:${{ matrix.tag }}-amd64"
          buildah manifest add --authfile "${AUTHFILE}" "${IMG}:${{ matrix.tag }}" "docker://${IMG}:${{ matrix.tag }}-arm64"

          # Push SHA-tagged manifest (pinnable version) and sign it
          push_manifest "${{ matrix.tag }}-${SHORT_SHA}"
          SIGNED_DIGEST="${PUSHED_DIGEST}"
          sign_manifest "${SIGNED_DIGEST}"

          # Push latest-tagged manifest
          push_signed_manifest "${{ matrix.tag }}-latest"

          # Push version-tagged manifest on tag pushes
          if echo "${{ github.ref }}" | grep -q "^refs/tags/v"; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            push_signed_manifest "${{ matrix.tag }}-${VERSION}"
          fi

  # Chart publishing — only on tag pushes (release)
  publish-chart:
    needs: [build-and-test, helm-lint, docker-push]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag format
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag format: $TAG. Expected vMAJOR.MINOR.PATCH (e.g., v1.2.3)"
            exit 1
          fi
          VERSION="${TAG#v}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Update chart version and image tags
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          SHORT_SHA: ${{ steps.parse.outputs.short_sha }}
        run: |
          CHART_DIR="helm/coding-agent-automation"

          # Update Chart.yaml version and appVersion
          sed -i "s/^version:.*/version: ${VERSION}/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "${CHART_DIR}/Chart.yaml"

          # Update all image tags in values.yaml to version-suffixed (Dependabot-compatible semver)
          sed -i "s/tag: coding-agent-web$/tag: coding-agent-web-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-kiro-dotnet10$/tag: coding-agent-kiro-dotnet10-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-kiro-python312$/tag: coding-agent-kiro-python312-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-kiro-java21$/tag: coding-agent-kiro-java21-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-opencode-dotnet10$/tag: coding-agent-opencode-dotnet10-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-opencode-java21$/tag: coding-agent-opencode-java21-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-opencode-python312$/tag: coding-agent-opencode-python312-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-claude-dotnet10$/tag: coding-agent-claude-dotnet10-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-claude-python312$/tag: coding-agent-claude-python312-${VERSION}/" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: coding-agent-claude-java21$/tag: coding-agent-claude-java21-${VERSION}/" "${CHART_DIR}/values.yaml"

          # Add auto-generated header
          sed -i '1i # Auto-generated by release workflow — do not edit manually' "${CHART_DIR}/values.yaml"

          echo "Chart version: ${VERSION}, appVersion: ${VERSION}"
          cat "${CHART_DIR}/Chart.yaml"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HELM_APP_ID }}
          private-key: ${{ secrets.HELM_APP_PRIVATE_KEY }}
          owner: Chemsorly
          repositories: helm-charts

      - name: Push chart to helm-charts repository
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          SHORT_SHA: ${{ steps.parse.outputs.short_sha }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/Chemsorly/helm-charts.git" /tmp/helm-charts
          cd /tmp/helm-charts

          # Remove old chart source and copy fresh
          rm -rf charts/coding-agent-automation/
          mkdir -p charts/coding-agent-automation/
          cp -r "${GITHUB_WORKSPACE}/helm/coding-agent-automation/"* charts/coding-agent-automation/
          rm -f charts/coding-agent-automation/ci-values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update coding-agent-automation chart v${VERSION} (app: ${SHORT_SHA})" || echo "No changes to commit"
          git push || (git pull --rebase && git push)
