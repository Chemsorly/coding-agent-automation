# Behavioral contracts for the pipeline's code-review orchestration.
# Each entry describes a specific scenario and the expected behavior.
# These are human-readable assertions — not executable tests.
# See docs/label-routing.md for the user-facing documentation of these behaviors.

- component: "CodeReviewOrchestrator"
  scenario: "No reviewer configurations match the job's labels (or all are disabled)"
  assertion: >
    When no reviewer configs match, review phase is skipped with Warning log
    (warn-and-skip, no fallback to DefaultReviewAgents).
    See docs/label-routing.md — "Reviewer Configurations" section.
  observable_signals:
    - log_level: Warning
      message_pattern: "Pipeline {RunId} no reviewer configurations matched — review phase skipped"
  unimplemented_signals:
    # metric: "pipeline.review.skipped" was specified but never emitted — the _reviewSkipped
    # counter field does not exist in AgentPhaseExecutor.CodeReview.cs. See issue #2638 for
    # the test coverage gap that left this undetected. Implement the counter and add a
    # WhenFlattenedAgentsIsEmpty_IncrementsReviewSkippedCounter test before adding it back here.
    - metric: "pipeline.review.skipped"
      increment: 1
  option: "B"
  last_verified: "2026-09-30"
  related_issues:
    - "#2454"
    - "#2638"
