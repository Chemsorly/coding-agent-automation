# coding-agent-automation Helm chart values
# See README for full documentation.

nameOverride: ""
fullnameOverride: ""

# ── Global image defaults ────────────────────────────────────────────────────

image:
  pullPolicy: IfNotPresent

# ── Orchestrator ─────────────────────────────────────────────────────────────

orchestrator:
  image:
    repository: chemsorly/coding-agent
    # Tag for the orchestrator image. On release, CI overwrites this to semver.
    tag: coding-agent-webui
  replicas: 1
  # Additional annotations on the Deployment metadata (e.g., reloader.stakater.com/auto: "true")
  annotations: {}
  # Pod-level securityContext (e.g., runAsUser, fsGroup for hostPath ownership)
  podSecurityContext: {}
  # Extra initContainers injected before the main container (e.g., permission fixers)
  initContainers: []
  leaderElection:
    # Override the PipelineLoopService leader election lease name.
    # Empty (default) = release-scoped: caa-<release>-pipeline-loop-lock
    # Set explicitly to use a fixed name across Helm releases.
    pipelineLoopLeaseName: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /healthz
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /readyz
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  terminationGracePeriodSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector: {}
  affinity: {}
  tolerations: []
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #  - host: coding-agent.example.com
    #    paths:
    #      - path: /
    #        pathType: Prefix
    tls: []
    #  - secretName: coding-agent-tls
    #    hosts:
    #      - coding-agent.example.com
  env:
    # Seconds to wait before resuming pipeline loop after pod restart (prevents dispatch to
    # agents mid-termination during rolling updates). Must be > agent terminationGracePeriodSeconds.
    pipelineLoopStartupDelaySeconds: 30
    # Seconds to wait after marking /readyz as 503 before proceeding with shutdown.
    readinessDrainDelaySeconds: 15
    # Log level for the orchestrator application
    logLevel: Information

# ── Secrets ──────────────────────────────────────────────────────────────────

secrets:
  # REQUIRED: API key for agent-orchestrator authentication.
  # Plain string value. Chart fails if empty and no existingSecret is set.
  agentApiKey: ""

  # Optional: OTEL exporter authorization header (e.g., "Api-Token dt0c01.xxx" for Dynatrace)
  otelHeaders: ""

  # Optional: OpenCode configuration JSON content (mounted as file for opencode agents)
  # Multi-line JSON string containing the opencode provider configuration.
  opencodeConfigContent: ""

# Name of an existing Kubernetes Secret to use instead of creating one.
# When set, the chart does NOT create a Secret resource and references this name
# in all volume mounts and env var sources.
# The referenced Secret must contain keys: agent-api-key, otel-headers,
# opencode-config-content
existingSecret: ""

# ── OpenTelemetry ────────────────────────────────────────────────────────────

otel:
  endpoint: ""
  protocol: grpc
  serviceName: coding-agent-orchestrator
  resourceAttributes: ""

# ── ServiceAccount ───────────────────────────────────────────────────────────

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

# ── Database (PostgreSQL) ────────────────────────────────────────────────────

database:
  # PostgreSQL host (service DNS name or IP). Required.
  host: ""
  # PostgreSQL port.
  port: 5432
  # Kubernetes Secret containing database credentials.
  # Must contain keys for username, password, and database name (defaults to standard Postgres env var names).
  auth:
    # Name of an existing K8s Secret with database credentials. Required.
    existingSecret: ""
    # Key names within the Secret (defaults match standard Postgres container env vars).
    keys:
      username: POSTGRES_USER
      password: POSTGRES_PASSWORD
      database: POSTGRES_DB
  # Npgsql SSL mode: Disable, Prefer, Require, VerifyCA, VerifyFull.
  # Defaults to Require in production if not set. Use "Disable" for in-cluster Postgres without TLS.
  sslMode: ""
  # Apply EF Core migrations on orchestrator startup.
  # true  — apply automatically on startup (safe for single-replica; avoid concurrent upgrades)
  # false — startup aborts when migrations are pending (blue/green — run them manually via
  #         `kubectl exec deployment/<name>-orchestrator -- dotnet CodingAgentWebUI.dll migrate`)
  migrateOnStartup: true

# ── Work Distribution ────────────────────────────────────────────────────────

workDistribution:
  # DispatchService settings
  dispatch:
    intervalSeconds: 10
    rateLimitPerSecond: 10
    chatSessionMaxDurationSeconds: 7200
    chatPodConnectTimeoutSeconds: 120
    chatTerminationGracePeriodSeconds: 120
  # ReconciliationService settings
  reconciliation:
    intervalSeconds: 30
    timeoutEnforcementEnabled: true
    staleRetentionDays: 7

# ── Credential Pools ─────────────────────────────────────────────────────────

credentialPools:
  # List of PVC names for kiro agent credential data.
  # DispatchService claims an available PVC per kiro-type Job.
  # PVCs MUST use ReadWriteOnce or ReadWriteOncePod access mode to prevent
  # concurrent access from multiple agent Jobs.
  kiro: []
  # Example:
  # kiro:
  #   - caa-kiro-cli-data-0
  #   - caa-kiro-cli-data-1
  #   - caa-kiro-cli-data-2

# ── Job Templates (Kubernetes mode) ─────────────────────────────────────────

# Job templates define the K8s Job pod spec for each agent label set.
# Each entry becomes a template in the job-templates ConfigMap that DispatchService
# uses to create K8s Job pods per WorkItem.
jobTemplates: []
  # Example:
  # - labels: "kiro,dotnet,dotnet10"
  #   image: "chemsorly/coding-agent:kiro-dotnet10"
  #   imagePullPolicy: Always  # Always (default), IfNotPresent, or Never
  #   providerType: kiro
  #   maxConcurrent: 2
  #   resources:
  #     requests:
  #       cpu: "100m"
  #       memory: "256Mi"
  #     limits:
  #       cpu: "4"
  #       memory: "8Gi"
  #   podSecurityContext:
  #     runAsUser: 1000
  #     runAsGroup: 1000
  #     fsGroup: 1000
  #   nodeSelector:
  #     kubernetes.io/hostname: k8s-worker-1
  #   initContainers:
  #     - name: fix-perms
  #       image: busybox:latest
  #       command: ["sh", "-c", "chown -R 1000:1000 /home/ubuntu/.local/share/kiro-cli"]
  #   tolerations:
  #     - key: agents
  #       operator: Exists
  #       effect: NoSchedule

# ── SignalR Backplane (Redis) ────────────────────────────────────────────────

signalr:
  redis:
    # Enable Redis backplane for SignalR. Required for multi-replica orchestrator
    # to deliver agent log streaming and real-time UI updates across replicas.
    enabled: false
    # Connection string for Redis. Operators deploy Redis independently
    # (e.g., Bitnami Redis chart, ElastiCache, Memorystore).
    connectionString: ""

# ── Monitoring ───────────────────────────────────────────────────────────────

monitoring:
  prometheusRules:
    # Create PrometheusRule resources for alerting (requires Prometheus Operator).
    enabled: false

# ── Pipeline API ─────────────────────────────────────────────────────────────

api:
  # api.enabled must be false by default — the API is dark until Spec 044 re-points agents.
  enabled: false
  image:
    repository: chemsorly/coding-agent
    tag: coding-agent-api
  # api.replicas MUST remain 1. Redis backplane handles hub message delivery but does NOT
  # make multiple API replicas safe — AgentRegistryService, OrchestratorRunService, and all
  # in-memory locking state is per-process. Spec 045 Task 13a rewrites the concurrency model
  # for multi-process topology. Do NOT increase replicas before that lands.
  replicas: 1
  service:
    type: ClusterIP
    port: 8090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  terminationGracePeriodSeconds: 30

# ── Job Controller ────────────────────────────────────────────────────────────

jobController:
  # Enable the Job Controller. Set to true only in the same helm upgrade that deploys
  # the updated monolith image (without DispatchService). See NOTES.txt for cutover notes.
  enabled: false
  image:
    repository: chemsorly/coding-agent
    tag: coding-agent-jobcontroller
  # replicas: leader election (caa-dispatch-lock) handles multi-replica safety.
  # Only the leader pod dispatches and reconciles; others idle waiting for leadership.
  replicas: 1
  service:
    port: 8091
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  leaderElection:
    # Override the dispatch lease name.
    # Empty (default) = release-scoped: caa-<release>-dispatch-lock
    # Set explicitly to use a fixed name across Helm releases (e.g. shared namespaces).
    dispatchLeaseName: ""
