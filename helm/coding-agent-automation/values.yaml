# coding-agent-automation Helm chart values
# See README for full documentation.

nameOverride: ""
fullnameOverride: ""

# ── Global image defaults ────────────────────────────────────────────────────

image:
  pullPolicy: IfNotPresent

# ── Web ──────────────────────────────────────────────────────────────────────

web:
  image:
    repository: chemsorly/coding-agent
    # Tag for the web image. On release, CI overwrites this to semver.
    tag: coding-agent-web
  replicas: 2
  # Additional annotations on the Deployment metadata (e.g., reloader.stakater.com/auto: "true")
  annotations: {}
  # Pod-level securityContext (e.g., runAsUser, fsGroup for hostPath ownership)
  podSecurityContext: {}
  # Extra initContainers injected before the main container (e.g., permission fixers)
  initContainers: []
  leaderElection:
    # Override the PipelineLoopService leader election lease name.
    # Empty (default) = release-scoped: caa-<release>-pipeline-loop-lock
    # Set explicitly to use a fixed name across Helm releases.
    pipelineLoopLeaseName: ""
  service:
    type: ClusterIP
    port: 8080
    # Annotations on the web Service. More than one replica needs sticky sessions: each open page
    # (a Blazor Server circuit) lives in one pod's memory, and its connection and reconnects must
    # reach that pod. Traefik reads stickiness from the Service:
    #   traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    # ingress-nginx reads it from web.ingress.annotations (nginx.ingress.kubernetes.io/affinity: cookie).
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    startup:
      path: /healthz
      port: 8080
      periodSeconds: 5
      failureThreshold: 30
    liveness:
      path: /healthz
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /readyz
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  # terminationGracePeriodSeconds must be >= HostOptions.ShutdownTimeout (40s) + preStop duration (5s).
  # preStop runs concurrently within the grace window, so effective post-SIGTERM window is
  # terminationGracePeriodSeconds - preStop = 45 - 5 = 40s, matching the host's ShutdownTimeout.
  # Previously 30s, which caused the process to be SIGKILL'd 15s into the drain window.
  # TODO [WARNING]: This arithmetic is only valid for the default values. readinessDrainDelaySeconds
  # and terminationGracePeriodSeconds are independently editable. If an operator raises
  # web.env.readinessDrainDelaySeconds without also raising terminationGracePeriodSeconds, the pod
  # will be SIGKILL'd mid-drain. The invariant
  #   readinessDrainDelaySeconds + ShutdownTimeout + buffer <= terminationGracePeriodSeconds - preStop
  # is documented in prose but not enforced at helm render time. The Web host validates this at
  # startup (ValidateShutdownBudget), which partially mitigates the risk at runtime.
  terminationGracePeriodSeconds: 45
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector: {}
  affinity: {}
  tolerations: []
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #  - host: coding-agent.example.com
    #    paths:
    #      - path: /
    #        pathType: Prefix
    tls: []
    #  - secretName: coding-agent-tls
    #    hosts:
    #      - coding-agent.example.com
    # With a tls section, the web host redirects clients that reached the ingress over plain HTTP
    # (X-Forwarded-Proto: http) to HTTPS, so the login form never posts a password unencrypted.
    # Set false when TLS ends in front of the ingress and the ingress sees only HTTP.
    httpsRedirect: true
  env:
    # Startup delay was previously needed to give the web hub time to rehydrate active runs
    # before dispatching. After Spec 044, the API owns IOrchestratorRunService and rehydrates on
    # its own startup; the web service no longer dispatches directly. Set to 0 (Spec 044 Req 7.2).
    pipelineLoopStartupDelaySeconds: 0
    # Seconds to wait after marking /readyz as 503 before proceeding with shutdown.
    readinessDrainDelaySeconds: 15
    # Log level for the web application
    logLevel: Information
    # Grafana Faro collector URL for frontend RUM monitoring.
    # Get this from Grafana Cloud → Frontend Observability → your app → Web SDK Config.
    # Leave empty to disable Faro (no CDN load, no data sent).
    faroCollectorUrl: ""
    # Base path for the Blazor web UI, injected as the <base href> in the HTML shell so the browser
    # resolves relative asset and navigation URLs against the app root.
    # The default "./" means "the app root": the web host renders a relative base that climbs from
    # the requested route back to the root ("./" on /overview, "../" on /runs/{id}). This works at a
    # root-path deployment and behind a reverse proxy that strips its prefix (e.g. Rancher's
    # service proxy) without further configuration.
    # Set an absolute path only to pin the base explicitly (e.g. Rancher: "/k8s/clusters/c-xxxxx/proxy/");
    # a rooted value is used as is, with a trailing "/" appended if missing.
    basePath: "./"

# ── Secrets ──────────────────────────────────────────────────────────────────

secrets:
  # API key for agent authentication.
  # When empty (default), a cryptographically secure key is auto-generated on first install
  # by a pre-install/pre-upgrade hook Job and stored in the chart-managed Secret.
  # The generated key is preserved across upgrades (the hook is a no-op when the Secret exists).
  # Set explicitly to use an operator-supplied key instead of auto-generation.
  # To retrieve the auto-generated key after install:
  #   kubectl get secret <release>-coding-agent-automation -n <ns> \
  #     -o jsonpath='{.data.agent-api-key}' | base64 -d
  agentApiKey: ""

  # Optional: OTEL exporter authorization header (e.g., "Api-Token dt0c01.xxx" for Dynatrace)
  otelHeaders: ""

  # Optional: OpenCode configuration JSON content for opencode providerType agent jobs.
  # When empty (default), the key is omitted from the chart-managed Secret entirely, allowing
  # operators to patch it manually via kubectl without it being overwritten on helm upgrade.
  # When set, this value takes precedence over any live-patched value in the Secret.
  opencodeConfigContent: ""

  # Optional: credentials for claude providerType agent jobs (Claude Code CLI). Set one or both;
  # the agent provider config's "Auth mode" picks which one a run uses (auto = API key if set,
  # otherwise the subscription token). Each key is omitted from the Secret when empty.
  # claudeApiKey: Anthropic API key from the Claude Console (billed per token).
  claudeApiKey: ""
  # claudeOauthToken: one-year subscription token printed by `claude setup-token`
  # (Pro, Max, Team or Enterprise plan). It does not warn before it expires — renew it yearly.
  claudeOauthToken: ""

# Name of an existing Kubernetes Secret to use instead of creating one.
# When set, the chart does NOT create a Secret resource and references this name
# in all volume mounts and env var sources.
# The referenced Secret must contain keys: agent-api-key, otel-headers.
# opencode-config-content is optional — only required when using opencode providerType agent templates.
# claude-api-key and claude-oauth-token are optional — used by claude providerType agent templates
# (e.g. synced by external-secrets next to opencode-config-content).
existingSecret: ""

# ── Authentication and roles (Spec 049) ──────────────────────────────────────
# The web UI requires a signed-in user. Sign-in is through one OIDC identity provider
# (Keycloak, Entra ID, ...) and/or the local "admin" account. Roles are bound to OIDC groups or
# users below, ArgoCD style. See docs/authentication.md.
# OIDC needs the UI at the root of its own host (web.ingress); the Rancher proxy / web.env.basePath
# is not supported once authentication is on.
auth:
  # Fixed session lifetime without sliding renewal: "<n>h", "<n>m" or a TimeSpan ("1.00:00:00").
  sessionDuration: 12h
  # Local admin login attempts allowed per client IP per minute.
  loginRateLimitPerMinute: 5

  admin:
    # Break-glass account "admin"; always a global admin. Disable it once OIDC works.
    enabled: true
    # Empty: the secret-init hook creates <fullname>-admin with a random 64-character password
    # (key "password") once and keeps it across upgrades. Read it with:
    #   kubectl get secret <release>-coding-agent-automation-admin -n <ns> -o jsonpath='{.data.password}' | base64 -d
    existingSecret: ""
    existingSecretKey: password

  oidc:
    enabled: false
    # Label of the login button: "Sign in with <name>".
    name: SSO
    # Keycloak: https://<host>/realms/<realm>    Entra ID: https://login.microsoftonline.com/<tenant-id>/v2.0
    issuer: ""
    clientId: ""
    # The client secret is read from an existing Secret (required when enabled).
    clientSecret:
      existingSecret: ""
      key: client-secret
    scopes: [openid, profile, email]
    # Keycloak: preferred_username. Entra ID: preferred_username (UPN) or email.
    usernameClaim: preferred_username
    # Keycloak: "groups" (Group Membership mapper, "Add to ID token" on).
    # Entra ID: "groups" (group object IDs) or "roles" (app roles).
    groupsClaim: groups

  rbac:
    # Role of every signed-in user without a matching binding: "" (no access), readonly or operator.
    defaultRole: ""
    # Roles: readonly < operator < admin. A binding names a group or a user; with "project" (the
    # project name) it applies to that project only. admin can only be bound globally.
    bindings: []
    # - group: platform-team
    #   role: admin
    # - group: 6f1c2a9e-0000-0000-0000-000000000000   # Entra ID group object ID
    #   role: operator
    #   project: payments-api
    # - user: alice@example.com
    #   role: readonly

# ── Secret Initialization Hook ───────────────────────────────────────────────
# Controls the pre-install/pre-upgrade hook Job that auto-generates the agent-api-key
# Secret on first install when secrets.agentApiKey is not set explicitly.
# The hook is skipped entirely when existingSecret or secrets.agentApiKey is set.

secretInit:
  image:
    # Alpine-based kubectl image for the secret-init hook Job.
    # Uses alpine/kubectl (Alpine Linux + kubectl binary) which includes /bin/sh, base64,
    # od, and tr — required by the init script. registry.k8s.io/kubectl is distroless
    # and cannot run shell scripts. bitnami/kubectl was deprecated in September 2025.
    # alpine/kubectl only maintains a rolling window of recent versions (~3 minor releases);
    # pin to a specific version tag matching or near your cluster minor version.
    # For production, override with a digest-pinned reference:
    #   e.g. alpine/kubectl@sha256:<digest>
    repository: alpine/kubectl
    tag: "1.37.1"
  # Maximum seconds the hook Job may run before it is forcibly failed.
  # Without this bound, a stuck image pull (air-gapped cluster, registry.k8s.io blocked)
  # would freeze `helm install` indefinitely since pre-install hooks block Helm until they
  # complete or fail. After this deadline the Job fails with a clear error message.
  activeDeadlineSeconds: 120
  # Resource requests/limits for the hook Job container.
  # Override if your cluster enforces LimitRange or ResourceQuota policies that reject
  # pods with no explicit resource specification.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ── OpenTelemetry ────────────────────────────────────────────────────────────

otel:
  endpoint: ""
  protocol: grpc
  # OTEL_SERVICE_NAME for the web component (Blazor UI process). API, JobController and Scheduler have
  # their own service names set in their deployment templates.
  webServiceName: coding-agent-web
  # OTEL_SERVICE_NAME for the API process.
  # Set to "coding-agent-api" to distinguish API spans, metrics and logs from the Blazor web process.
  # The Grafana "Recent Pipeline Traces" panel no longer depends on rootServiceName="coding-agent-web"
  # (updated in #2966), so changing this default does not break that panel.
  # ⚠️  Breaking change: upgrading from a previous release will rename API telemetry from
  # "coding-agent-web" to "coding-agent-api" — update any Grafana dashboards or alerts that
  # filter on service.name="coding-agent-web" for API traffic.
  apiServiceName: coding-agent-api
  resourceAttributes: ""

# ── ServiceAccount ───────────────────────────────────────────────────────────

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

# ── Database (PostgreSQL) ────────────────────────────────────────────────────

database:
  # PostgreSQL host (service DNS name or IP). Required.
  host: ""
  # PostgreSQL port.
  port: 5432
  # Kubernetes Secret containing database credentials.
  # Must contain keys for username, password, and database name (defaults to standard Postgres env var names).
  auth:
    # Name of an existing K8s Secret with database credentials. Required.
    existingSecret: ""
    # Key names within the Secret (defaults match standard Postgres container env vars).
    keys:
      username: POSTGRES_USER
      password: POSTGRES_PASSWORD
      database: POSTGRES_DB
  # Npgsql SSL mode: Disable, Prefer, Require, VerifyCA, VerifyFull.
  # Defaults to Require in production if not set. Use "Disable" for in-cluster Postgres without TLS.
  sslMode: ""
  # Apply EF Core migrations when the Pipeline API starts (under an advisory lock).
  # false — the API aborts startup while migrations are pending.
  migrateOnStartup: true

# ── Work Distribution ────────────────────────────────────────────────────────

workDistribution:
  # DispatchService settings
  dispatch:
    intervalSeconds: 10
    rateLimitPerSecond: 10
    # Maximum lifetime (seconds) of a chat session K8s Job pod.
    # Sets activeDeadlineSeconds on chat session pods ONLY.
    # Work-item agent jobs and consolidation jobs derive their deadline from
    # PipelineConfiguration.AgentTimeout (per-project overridable, default 30 min = 1800s).
    # Operators upgrading from agentJobTimeoutSeconds: this field no longer controls agent job
    # wall-clock limits — configure AgentTimeout in Pipeline Settings instead.
    # TODO: Consider adding a values.yaml comment referencing the UI/API path for AgentTimeout
    # so operators know where to find the agent-job timeout control. (DotNetSpecialist review [WARNING])
    chatJobMaxDurationSeconds: 7200
    chatPodConnectTimeoutSeconds: 120
    chatTerminationGracePeriodSeconds: 120
    # Maximum seconds a chat pod may remain idle (no client keepalive) before automatic termination.
    # The Blazor UI sends a heartbeat every 30s while the chat window is open; pods whose window
    # has been closed or crashed are cleaned up within this window. Default: 90s. Minimum: 10s.
    chatIdleTimeoutSeconds: 90
  # ReconciliationService settings
  reconciliation:
    intervalSeconds: 30
    staleRetentionDays: 7

# ── Credential Pools ─────────────────────────────────────────────────────────

credentialPools:
  # List of PVC names for kiro agent credential data.
  # DispatchService claims an available PVC per kiro-type Job.
  # PVCs MUST use ReadWriteOnce or ReadWriteOncePod access mode to prevent
  # concurrent access from multiple agent Jobs.
  kiro: []
  # Example:
  # kiro:
  #   - caa-kiro-cli-data-0
  #   - caa-kiro-cli-data-1
  #   - caa-kiro-cli-data-2

# ── Job Templates (Kubernetes mode) ─────────────────────────────────────────

# Job templates define the K8s Job pod spec for each agent label set.
# Each entry becomes a template in the job-templates ConfigMap that DispatchService
# uses to create K8s Job pods per WorkItem.
jobTemplates: []
  # Example:
  # - labels: "kiro,dotnet,dotnet10"
  #   image: "chemsorly/coding-agent:coding-agent-kiro-latest"
  #   imagePullPolicy: Always  # Always (default), IfNotPresent, or Never
  #   providerType: kiro       # kiro, opencode or claude
  #   maxConcurrent: 2
  #   resources:
  #     requests:
  #       cpu: "100m"
  #       memory: "256Mi"
  #     limits:
  #       cpu: "4"
  #       memory: "8Gi"
  #   podSecurityContext:
  #     runAsUser: 1000
  #     runAsGroup: 1000
  #     fsGroup: 1000
  #   nodeSelector:
  #     kubernetes.io/hostname: k8s-worker-1
  #   initContainers:
  #     - name: fix-perms
  #       image: busybox:latest
  #       command: ["sh", "-c", "chown -R 1000:1000 /home/ubuntu/.local/share/kiro-cli"]
  #   tolerations:
  #     - key: agents
  #       operator: Exists
  #       effect: NoSchedule

# ── SignalR Backplane (Redis) ────────────────────────────────────────────────

signalr:
  redis:
    # NOTE: This flag is used only in NOTES.txt to warn about multi-replica deployments
    # without a backplane. It does NOT gate Redis configuration in any deployment template —
    # all templates gate exclusively on connectionString being non-empty.
    # To enable the Redis backplane, set connectionString to a valid Redis connection string.
    # Setting enabled: true without a non-empty connectionString has no effect.
    enabled: false
    # Connection string for Redis. Operators deploy Redis independently
    # (e.g., Bitnami Redis chart, ElastiCache, Memorystore).
    connectionString: ""

# ── Monitoring ───────────────────────────────────────────────────────────────

monitoring:
  prometheusRules:
    # Create PrometheusRule resources for alerting (requires Prometheus Operator).
    enabled: false

# ── Pipeline API ─────────────────────────────────────────────────────────────

api:
  # The Pipeline API is required. It is the sole owner of the database and the only host of
  # /hubs/agent and /api/work-items/*, so agent pods, the Job Controller and the web service
  # all depend on it. Set this to false only when an API is deployed out of band, in which case
  # api.baseUrl must point at it (the chart fails at render time otherwise).
  enabled: true
  image:
    repository: chemsorly/coding-agent
    tag: coding-agent-api
  # Spec 046: api.replicas > 1 requires signalr.redis.connectionString to be set.
  # AgentRegistryService and OrchestratorRunService switch to Redis-backed distributed mode
  # automatically when Redis is configured. Without Redis the API falls back to in-memory
  # implementations and hub messages cannot be routed cross-replica.
  # Defaults to 2 (HA) so a PodDisruptionBudget is created and any single-pod disruption
  # (node drain, OOMKill, rolling update) does not cause a full API outage. Requires
  # signalr.redis.connectionString — the chart fails at render time (see _deprecations.tpl)
  # if replicas > 1 and Redis is not configured. For single-replica (in-memory) deployments
  # without Redis, set replicas: 1 explicitly.
  replicas: 2
  # Additional annotations on the Deployment metadata (e.g., reloader.stakater.com/auto: "true")
  annotations: {}
  service:
    type: ClusterIP
    port: 8080
  # serviceUrl is the in-cluster URL that agent pods use to reach the API hub and HTTP
  # endpoints (ORCHESTRATOR_URL). Both work-item pods and chat pods share this single config
  # key (WorkDistribution__OrchestratorUrl) — changing it re-points both shapes simultaneously
  # (Spec 044 Req C2.1 option a). Default derives from release name and api.service.port.
  serviceUrl: ""
  # Spec 045 Req 6.4/6.5: API base URL and hub URL for the web service to connect
  # to the Pipeline API for config loading (IPipelineApiConfigClient) and live streaming
  # (IAgentHubConnection). When empty, the chart computes the default in-cluster URL from
  # the release name, namespace, and api.service.port. Override for external or custom routing.
  # REQUIRED when api.enabled is false. When empty and api.enabled is false, the chart
  # fails at render time — the web service would otherwise compute an in-cluster URL
  # (http://{fullname}-api.{namespace}.svc.cluster.local:{port}) pointing to a service
  # that does not exist, causing silent runtime failures on the first HTTP call.
  # Set to the URL of the externally deployed Pipeline API (e.g. http://api.example.com:8080).
  baseUrl: ""    # override if API is not in same cluster/namespace
  hubUrl: ""     # override for hub URL (defaults to baseUrl + /hubs/agent)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      # Raised from 512Mi to reduce OOMKill risk. The API hosts SignalR, EF Core connection pools,
      # and AgentRegistryService in-memory state. 512Mi was a frequent OOMKill boundary.
      # For production HA deployments, 768Mi is recommended minimum.
      memory: 768Mi
  # terminationGracePeriodSeconds must be >= HostOptions.ShutdownTimeout (40s) + preStop duration (5s).
  # preStop runs concurrently within the grace window, so effective post-SIGTERM window is
  # terminationGracePeriodSeconds - preStop = 45 - 5 = 40s, matching the host's ShutdownTimeout.
  # Previously 30s, which caused the process to be SIGKILL'd 15s into the drain window.
  # TODO [WARNING]: This arithmetic is only valid for the default values. readinessDrainDelaySeconds
  # and terminationGracePeriodSeconds are independently editable. If an operator raises
  # api.env.readinessDrainDelaySeconds (e.g. to 45) without also raising terminationGracePeriodSeconds,
  # the pod will be SIGKILL'd mid-drain. The invariant
  #   readinessDrainDelaySeconds + ShutdownTimeout + buffer <= terminationGracePeriodSeconds - preStop
  # is documented in prose but not enforced at helm render time (unlike the replicas>1/Redis guard in
  # _deprecations.tpl). Consider adding a Helm validation or a clear operator note in docs.
  terminationGracePeriodSeconds: 45
  env:
    logLevel: Information
    dbLogLevel: Warning
    # Seconds to wait after marking /readyz as 503 before proceeding with shutdown.
    # Allows Kubernetes to remove the pod from Service endpoints before connections are dropped.
    # Mirrors web.env.readinessDrainDelaySeconds. Must be < terminationGracePeriodSeconds - preStop.
    readinessDrainDelaySeconds: 15

# ── Job Controller ────────────────────────────────────────────────────────────

jobController:
  # The Job Controller owns the dispatch and reconciliation loops. Nothing else runs them —
  # the web service's copies were removed — so with this off no work item is ever dispatched
  # and the queue silently grows. Disable only when running the controller out of band.
  enabled: true
  image:
    repository: chemsorly/coding-agent
    tag: coding-agent-jobcontroller
  # Leader election (caa-dispatch-lock) handles multi-replica safety.
  # Only the leader pod dispatches and reconciles; others idle as hot standbys.
  replicas: 2
  # Additional annotations on the Deployment metadata (e.g., reloader.stakater.com/auto: "true")
  annotations: {}
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    # Log level for the Job Controller and the agent pods it spawns.
    # Agent pods inherit this value via JobSpecBuilder env propagation.
    logLevel: Information
  leaderElection:
    # Override the dispatch lease name.
    # Empty (default) = release-scoped: caa-<release>-dispatch-lock
    # Set explicitly to use a fixed name across Helm releases (e.g. shared namespaces).
    dispatchLeaseName: ""
  terminationGracePeriodSeconds: 30

# =============================================================================
# Scheduler microservice (Spec 047)
# Owns all scheduled/periodic background work. No direct Postgres connection.
# =============================================================================
scheduler:
  enabled: true
  replicas: 2
  image:
    repository: chemsorly/coding-agent
    # Tag is overridden at deploy time with the build SHA. Empty = fail fast on deploy.
    tag: ""
  # Additional annotations on the Deployment metadata (e.g., reloader.stakater.com/auto: "true")
  annotations: {}
  service:
    type: ClusterIP
    port: 8080
  # URL the web service uses to reach the Scheduler's loop control endpoints.
  # Empty (default) = computed in-cluster: http://{fullname}-scheduler.{namespace}.svc.cluster.local:{port}
  # Set when scheduler.enabled is false or the Scheduler is reachable via a non-default address.
  baseUrl: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  leaderElection:
    # Scheduler-specific K8s Lease name — distinct from the API's lease.
    # Empty (default) = release-scoped: caa-<release>-scheduler-lock
    leaseName: ""
  terminationGracePeriodSeconds: 90
  nodeSelector: {}
  env:
    logLevel: Information
