# helm unittest suite for the web host's cluster access.
# Run with: helm unittest helm/coding-agent-automation
#
# The web host is the internet-facing pod and makes no Kubernetes API calls: leader election runs
# in the Scheduler and the Job Controller, Job creation in the Pipeline API.
#
# Covers:
#   1. No service account token is mounted into the web pod
#   2. No leader-election settings are passed to the web pod
#   3. The web ConfigMap carries no work-distribution keys
#   4. The removed pipeline-loop startup delay is not rendered
#   5. The web pod's environment, mounts and ConfigMap match an allow-list (spec 052 Task 5.8)

suite: web cluster access

templates:
  - templates/web-deployment.yaml
  - templates/web-env-configmap.yaml

# Required values to avoid render failures in dependent templates
set:
  database.host: "pg-host"
  database.auth.existingSecret: "my-secret"
  signalr.redis.connectionString: "redis:6379"

tests:

  - it: mounts no service account token into the web pod
    template: templates/web-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: passes no leader-election settings to the web pod
    template: templates/web-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LeaderElection__PipelineLoopLeaseName
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LeaderElection__Namespace
          any: true

  - it: carries no work-distribution settings (the chat connect timeout comes from the API)
    template: templates/web-env-configmap.yaml
    asserts:
      - notExists:
          path: data.WorkDistribution__Dispatch__ChatPodConnectTimeoutSeconds
      - notExists:
          path: data.WorkDistribution__OrchestratorUrl
      - notExists:
          path: data.WorkDistribution__AgentApiKeySecretName
      - notExists:
          path: data.WorkDistribution__Namespace

  - it: renders no pipeline-loop startup delay
    template: templates/web-env-configmap.yaml
    asserts:
      - notExists:
          path: data.PIPELINE_LOOP_STARTUP_DELAY_SECONDS

  # Spec 051 4.1: the web calls the API as the signed-in user, never with the agent API key.
  - it: gives the web pod no agent API key and no job templates
    template: templates/web-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AGENT_API_KEY
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: job-templates
          any: true

  # Spec 052 Req 0.3, 0.4 (Task 5.8): the web pod's environment and mounts are exactly these. A new
  # variable or mount fails here until it is added on purpose; nothing of the database, Redis, the
  # master API key or a provider reaches the internet-facing pod.
  - it: gives the web pod only the allow-listed environment variables
    template: templates/web-deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 11
      - contains: { path: spec.template.spec.containers[0].env, content: { name: OTEL_EXPORTER_OTLP_HEADERS }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: UserToken__SigningKey }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: DataProtection__Key }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: Auth__Admin__Password }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: PipelineApi__BaseUrl }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: OTEL_SERVICE_NAME }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: OTEL_EXPORTER_OTLP_ENDPOINT }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: OTEL_EXPORTER_OTLP_PROTOCOL }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: K8S_NAMESPACE_NAME }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: K8S_POD_NAME }, any: true }
      - contains: { path: spec.template.spec.containers[0].env, content: { name: OTEL_RESOURCE_ATTRIBUTES }, any: true }

  - it: adds only the OIDC client secret when OIDC is on
    template: templates/web-deployment.yaml
    set:
      auth.oidc.enabled: true
      auth.oidc.issuer: "https://idp.example"
      auth.oidc.clientId: "web"
      auth.oidc.clientSecret.existingSecret: "oidc"
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 12
      - contains: { path: spec.template.spec.containers[0].env, content: { name: Auth__Oidc__ClientSecret }, any: true }

  - it: mounts only the auth config into the web pod, and takes settings only from its ConfigMap
    template: templates/web-deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /app/config/auth.json
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - matchRegex:
          path: spec.template.spec.volumes[0].configMap.name
          pattern: -web-auth$
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          pattern: -web-env$

  - it: carries no database, Redis, API key or provider settings in the web ConfigMap
    template: templates/web-env-configmap.yaml
    asserts:
      - notExists: { path: data.Database__Host }
      - notExists: { path: data.Database__Name }
      - notExists: { path: data.ConnectionStrings__Redis }
      - notExists: { path: data.SignalR__Redis__ConnectionString }
      - notExists: { path: data.AGENT_API_KEY }
      - notExists: { path: data.OperatorApiKey }
