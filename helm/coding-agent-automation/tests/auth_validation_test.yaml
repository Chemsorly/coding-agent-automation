# helm unittest suite for the render-time validation of the auth values (Spec 049).
# Run with: helm unittest helm/coding-agent-automation
#
# Only the auth ConfigMap is rendered, so the failure is attributed to it (the web Deployment
# includes the ConfigMap for its checksum and would otherwise report the same error).

suite: authentication values validation

templates:
  - templates/web-auth-configmap.yaml

set:
  signalr.redis.connectionString: "redis:6379"

tests:
  - it: renders with the default values
    asserts:
      - hasDocuments:
          count: 1

  - it: fails without any login method
    set:
      auth.admin.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "authentication cannot be turned off"

  - it: fails when OIDC is enabled without an issuer
    set:
      auth.oidc.enabled: true
      auth.oidc.clientId: coding-agent
      auth.oidc.clientSecret.existingSecret: oidc-secret
    asserts:
      - failedTemplate:
          errorPattern: "auth.oidc.issuer is empty"

  - it: fails when OIDC is enabled without a client secret
    set:
      auth.oidc.enabled: true
      auth.oidc.issuer: https://kc.example.com/realms/acme
      auth.oidc.clientId: coding-agent
    asserts:
      - failedTemplate:
          errorPattern: "clientSecret.existingSecret is empty"

  - it: fails when any role is bound to the Default project
    set:
      auth.rbac.bindings:
        - group: team-a
          role: admin
          projectId: 00000000-0000-0000-0000-000000000000
    asserts:
      - failedTemplate:
          errorPattern: "Default project"

  - it: fails when operator is bound to the Default project
    set:
      auth.rbac.bindings:
        - group: team-a
          role: operator
          projectId: 00000000-0000-0000-0000-000000000000
    asserts:
      - failedTemplate:
          errorPattern: "Default project"

  - it: accepts admin bound to a non-default project
    set:
      auth.rbac.bindings:
        - group: team-a
          role: admin
          projectId: 6f1c2a9e-0000-0000-0000-000000000000
    asserts:
      - hasDocuments:
          count: 1

  - it: fails when project key is used instead of projectId
    set:
      auth.rbac.bindings:
        - group: team-a
          role: operator
          project: payments-api
    asserts:
      - failedTemplate:
          errorPattern: "no longer supported"

  - it: fails when projectId is not a valid GUID
    set:
      auth.rbac.bindings:
        - group: team-a
          role: operator
          projectId: payments-api
    asserts:
      - failedTemplate:
          errorPattern: "which is not a project ID"

  - it: accepts several web replicas without Redis (spec 051 D10, the key ring comes from a Secret)
    set:
      signalr.redis.connectionString: ""
      web.replicas: 2
    asserts:
      - hasDocuments:
          count: 1

  - it: accepts several web replicas with Redis
    set:
      web.replicas: 2
    asserts:
      - hasDocuments:
          count: 1
