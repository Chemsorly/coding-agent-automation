# helm unittest suite for consolidation dead-flag removal (issue #3151).
# Run with: helm unittest helm/coding-agent-automation
#
# Verifies that the removed feature-flag env var is absent from both deployments.

suite: consolidation dead-flag env var removal

templates:
  - templates/web-deployment.yaml
  - templates/api-deployment.yaml

# Minimum values required to render dependent templates without failure.
# Matches the pattern used by otel_test.yaml.
set:
  database.host: "pg-host"
  database.auth.existingSecret: "my-secret"
  secrets.agentApiKey: "test-key"
  api.enabled: true
  scheduler.enabled: true
  # Required by the chart's render-time checks (api.replicas > 1 needs Redis; an enabled scheduler needs dispatch).
  scheduler.dispatch.enabled: true
  signalr.redis.connectionString: "redis:6379"
  jobController.enabled: true

tests:

  # TODO: Add a positive baseline assertion (e.g. hasDocuments: count: 1, or a `contains` check
  # for a known-always-present env var such as ASPNETCORE_ENVIRONMENT) to ensure the templates
  # rendered real container env lists — otherwise notContains is vacuously true if the container
  # spec renders empty. (WARNING: TestQualityReviewer)

  - it: web deployment does not inject the removed consolidation feature-flag env var
    template: templates/web-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: Consolidation__UnifiedDispatch__Enabled

  - it: api deployment does not inject the removed consolidation feature-flag env var
    template: templates/api-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: Consolidation__UnifiedDispatch__Enabled
