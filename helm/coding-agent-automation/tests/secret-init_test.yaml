# helm unittest suite for secret-init conditional rendering logic.
# Run with: helm unittest helm/coding-agent-automation
#
# Covers the acceptance criteria that helm lint / helm template cannot assert:
#   1. Hook Job is rendered on the auto-generation path (no agentApiKey, no existingSecret)
#   2. Hook Job is absent on the existingSecret path
#   3. Hook Job is absent on the explicit-key path
#   4. secrets.yaml Secret is NOT rendered on the auto-generation path (avoids ownership collision)
#   5. secrets.yaml Secret IS rendered on the explicit-key path with resource-policy: keep
#   6. RBAC resources carry hook-weight -10 (earlier than Job at -5) for correct ordering
#   7. ArgoCD PreSync annotation is present on the Job

suite: secret-init conditional rendering

templates:
  - templates/secret-init-job.yaml
  - templates/secret-init-rbac.yaml
  - templates/secrets.yaml

tests:
  # ── AC1: auto-generation path renders the hook Job ──────────────────────────
  - it: renders hook Job when agentApiKey is empty and existingSecret is absent
    template: templates/secret-init-job.yaml
    set:
      secrets.agentApiKey: ""
      existingSecret: ""
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade"
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"

  # ── AC7: ArgoCD PreSync annotation present on Job ───────────────────────────
  - it: Job carries ArgoCD PreSync hook annotation for out-of-cluster sync tools
    template: templates/secret-init-job.yaml
    set:
      secrets.agentApiKey: ""
      existingSecret: ""
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: "PreSync"

  # ── AC4 (job): hook Job is absent when existingSecret is set ────────────────
  - it: suppresses hook Job when existingSecret is set
    template: templates/secret-init-job.yaml
    set:
      existingSecret: "my-existing-secret"
      secrets.agentApiKey: ""
    asserts:
      - hasDocuments:
          count: 0

  # ── AC4 (job): hook Job is absent when agentApiKey is explicitly set ─────────
  - it: suppresses hook Job when agentApiKey is explicitly provided
    template: templates/secret-init-job.yaml
    set:
      secrets.agentApiKey: "myexplicitkey"
      existingSecret: ""
    asserts:
      - hasDocuments:
          count: 0

  # ── AC4 (rbac): RBAC resources absent when existingSecret is set ─────────────
  - it: suppresses all RBAC resources when existingSecret is set
    template: templates/secret-init-rbac.yaml
    set:
      existingSecret: "my-existing-secret"
      secrets.agentApiKey: ""
    asserts:
      - hasDocuments:
          count: 0

  # ── AC4 (rbac): RBAC resources absent when agentApiKey is explicitly set ─────
  - it: suppresses all RBAC resources when agentApiKey is explicitly provided
    template: templates/secret-init-rbac.yaml
    set:
      secrets.agentApiKey: "myexplicitkey"
      existingSecret: ""
    asserts:
      - hasDocuments:
          count: 0

  # ── RBAC hook-weight ordering: -10 (before Job at -5) ───────────────────────
  - it: RBAC resources use hook-weight -10 to run before the Job (weight -5)
    template: templates/secret-init-rbac.yaml
    set:
      secrets.agentApiKey: ""
      existingSecret: ""
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
          documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
          documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
          documentIndex: 2

  # ── RBAC hook-delete-policy includes hook-succeeded ─────────────────────────
  - it: RBAC resources are cleaned up after successful execution (hook-succeeded)
    template: templates/secret-init-rbac.yaml
    set:
      secrets.agentApiKey: ""
      existingSecret: ""
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
          documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
          documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
          documentIndex: 2

  # ── AC3/AC1: No Helm-managed Secret rendered on auto-generation path ─────────
  # On the auto-generation path the Secret is created by the hook Job (kubectl create).
  # Rendering a Helm-managed Secret with the same name would cause an ownership collision
  # (Helm rejects "exists and cannot be imported into the current release").
  - it: does NOT render a Helm-managed Secret on the auto-generation path
    template: templates/secrets.yaml
    set:
      secrets.agentApiKey: ""
      existingSecret: ""
      secrets.otelHeaders: ""
      secrets.opencodeConfigContent: ""
    asserts:
      - hasDocuments:
          count: 0

  # ── AC3: explicit-key path renders Secret with resource-policy keep ──────────
  - it: renders Helm-managed Secret with resource-policy keep when agentApiKey is set
    template: templates/secrets.yaml
    set:
      secrets.agentApiKey: "myexplicitkey"
      existingSecret: ""
      secrets.otelHeaders: ""
      secrets.opencodeConfigContent: ""
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: stringData["agent-api-key"]
          value: "myexplicitkey"

  # ── existingSecret path: no Helm-managed Secret rendered ────────────────────
  - it: does NOT render a Helm-managed Secret when existingSecret is set
    template: templates/secrets.yaml
    set:
      existingSecret: "my-existing-secret"
      secrets.agentApiKey: ""
      secrets.otelHeaders: ""
      secrets.opencodeConfigContent: ""
    asserts:
      - hasDocuments:
          count: 0
