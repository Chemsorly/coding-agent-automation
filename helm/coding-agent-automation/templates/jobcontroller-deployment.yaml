{{- if .Values.jobController.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-jobcontroller
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: jobcontroller
  {{- with .Values.jobController.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.jobController.replicas }}
  # RollingUpdate is safe with multi-replica: /readyz returns 200 for all replicas regardless of
  # leader state, so the new pod becomes Ready and the old one terminates cleanly.
  # Leader election gates actual dispatch/reconciliation — the non-leader idles until it wins.
  strategy:
    type: {{ .Values.jobController.strategy.type }}
    {{- if eq .Values.jobController.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.jobController.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.jobController.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "coding-agent-automation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jobcontroller
  template:
    metadata:
      labels:
        {{- include "coding-agent-automation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jobcontroller
    spec:
      serviceAccountName: {{ include "coding-agent-automation.fullname" . }}-jobcontroller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.jobController.terminationGracePeriodSeconds }}
      containers:
        - name: jobcontroller
          image: "{{ .Values.jobController.image.repository }}:{{ .Values.jobController.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.jobController.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.jobController.service.port }}
            periodSeconds: {{ .Values.jobController.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.jobController.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.jobController.service.port }}
            initialDelaySeconds: {{ .Values.jobController.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.jobController.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.jobController.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.jobController.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.jobController.service.port }}
            initialDelaySeconds: {{ .Values.jobController.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.jobController.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.jobController.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.jobController.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.jobController.resources | nindent 12 }}
          env:
            {{- include "coding-agent-automation.commonSecretEnv" . | nindent 12 }}
            {{- include "coding-agent-automation.otelEnv" (dict "root" . "serviceName" "coding-agent-jobcontroller") | nindent 12 }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.jobController.service.port }}"
            - name: PipelineApi__BaseUrl
              value: {{ include "coding-agent-automation.apiBaseUrl" . | quote }}
            - name: LeaderElection__DispatchLeaseName
              value: {{ if .Values.jobController.leaderElection.dispatchLeaseName -}}
                {{- .Values.jobController.leaderElection.dispatchLeaseName | quote }}
              {{- else -}}
                {{- printf "caa-%s-dispatch-lock" .Release.Name | quote }}
              {{- end }}
            - name: LeaderElection__Namespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- include "coding-agent-automation.workDistributionEnv" . | nindent 12 }}
          volumeMounts:
            - name: job-templates
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: job-templates
          configMap:
            name: {{ include "coding-agent-automation.fullname" . }}-job-templates
            optional: true
{{- end }}
