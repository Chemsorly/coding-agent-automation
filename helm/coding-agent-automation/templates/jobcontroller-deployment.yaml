{{- if .Values.jobController.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-jobcontroller
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: jobcontroller
  {{- with .Values.jobController.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.jobController.replicas | default 1 }}
  # RollingUpdate is safe with multi-replica: /readyz returns 200 for all replicas regardless of
  # leader state, so the new pod becomes Ready and the old one terminates cleanly.
  # Leader election gates actual dispatch/reconciliation — the non-leader idles until it wins.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "coding-agent-automation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jobcontroller
  template:
    metadata:
      labels:
        {{- include "coding-agent-automation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jobcontroller
    spec:
      serviceAccountName: {{ include "coding-agent-automation.fullname" . }}-jobcontroller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.jobController.terminationGracePeriodSeconds }}
      {{- if gt (int .Values.jobController.replicas) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "coding-agent-automation.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: jobcontroller
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: jobcontroller
          image: "{{ .Values.jobController.image.repository }}:{{ .Values.jobController.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.jobController.service.port }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          # Startup probe gives the Job Controller up to 150 seconds to initialise
          # (30 × 5 s) before liveness kicks in. Without this, liveness kills the pod
          # after 40 s (initialDelaySeconds=10 + 3×10 s), which is too short for cold
          # starts that include leader-election lease acquisition. Matches api-deployment.yaml.
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.jobController.service.port }}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.jobController.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.jobController.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.jobController.resources | nindent 12 }}
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.jobController.service.port }}"
            - name: PipelineApi__BaseUrl
              value: {{ include "coding-agent-automation.apiBaseUrl" . | quote }}
            {{- include "coding-agent-automation.secretEnv" . | nindent 12 }}
            {{- include "coding-agent-automation.otelEnv" (dict "serviceName" "coding-agent-jobcontroller" "root" .) | nindent 12 }}
            # Leader election lease names — release-scoped to prevent collision
            # when multiple Helm releases share a namespace (e.g. staging vs prod).
            - name: LOG_LEVEL
              value: {{ .Values.jobController.env.logLevel | default "Information" | quote }}
            - name: LeaderElection__DispatchLeaseName
              value: {{ include "coding-agent-automation.leaseName" (dict "override" .Values.jobController.leaderElection.dispatchLeaseName "suffix" "dispatch-lock" "root" .) }}
            - name: LeaderElection__Namespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # WorkDistribution env vars — required by DispatchServiceOptionsFactory.
            {{- include "coding-agent-automation.workDistributionEnv" . | nindent 12 }}
            - name: WorkDistribution__Reconciliation__IntervalSeconds
              value: {{ .Values.workDistribution.reconciliation.intervalSeconds | quote }}
            - name: WorkDistribution__Reconciliation__StaleRetentionDays
              value: {{ .Values.workDistribution.reconciliation.staleRetentionDays | quote }}
          volumeMounts:
            - name: job-templates
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: job-templates
          configMap:
            name: {{ include "coding-agent-automation.fullname" . }}-job-templates
            optional: true
{{- end }}
