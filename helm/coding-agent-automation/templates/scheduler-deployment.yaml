{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-scheduler
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  {{- with .Values.scheduler.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.scheduler.replicas }}
  strategy:
    type: {{ .Values.scheduler.strategy.type }}
    {{- if eq .Values.scheduler.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.scheduler.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.scheduler.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "coding-agent-automation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "coding-agent-automation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: {{ include "coding-agent-automation.fullname" . }}-scheduler
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.scheduler.terminationGracePeriodSeconds }}
      {{- with .Values.scheduler.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ required "scheduler.image.tag is required" .Values.scheduler.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.scheduler.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ .Values.scheduler.probes.path }}
              port: {{ .Values.scheduler.service.port }}
            initialDelaySeconds: {{ .Values.scheduler.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.scheduler.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.scheduler.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.scheduler.probes.path }}
              port: {{ .Values.scheduler.service.port }}
            initialDelaySeconds: {{ .Values.scheduler.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.scheduler.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.scheduler.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.scheduler.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.scheduler.probes.path }}
              port: {{ .Values.scheduler.service.port }}
            initialDelaySeconds: {{ .Values.scheduler.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.scheduler.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.scheduler.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.scheduler.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          env:
            {{- include "coding-agent-automation.commonSecretEnv" . | nindent 12 }}
            {{- include "coding-agent-automation.otelEnv" (dict "root" . "serviceName" "coding-agent-scheduler") | nindent 12 }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.scheduler.service.port }}"
            - name: PipelineApi__BaseUrl
              value: {{ include "coding-agent-automation.apiBaseUrl" . | quote }}
            - name: LeaderElection__LeaseName
              value: {{ if .Values.scheduler.leaderElection.leaseName -}}
                {{- .Values.scheduler.leaderElection.leaseName | quote }}
              {{- else -}}
                {{- printf "caa-%s-scheduler-lock" .Release.Name | quote }}
              {{- end }}
            - name: LeaderElection__Namespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.signalr.redis.connectionString }}
            - name: SignalR__Redis__ConnectionString
              value: {{ .Values.signalr.redis.connectionString | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.scheduler.env.logLevel | quote }}
{{- end }}
