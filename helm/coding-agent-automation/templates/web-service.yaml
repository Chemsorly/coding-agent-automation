{{- /* Web component values, with back-compat: legacy `orchestrator.*` overrides win over `web.*` defaults. */ -}}
{{- $web := mergeOverwrite (deepCopy (.Values.web | default dict)) (.Values.orchestrator | default dict) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-web
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ $web.service.type }}
  ports:
    - port: {{ $web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "coding-agent-automation.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
