apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-orchestrator
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  # Leader election via Lease — PipelineLoopService and ConsolidationWorkItemDispatchService (Spec 043).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
  # batch/jobs required for ChatJobDispatcher (still runs in orchestrator until Spec 044)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # pods get/list for startup failure detection in ChatJobDispatcher
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-orchestrator
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "coding-agent-automation.fullname" . }}-orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ include "coding-agent-automation.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
