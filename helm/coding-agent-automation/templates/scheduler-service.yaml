{{- if .Values.scheduler.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-scheduler
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  type: {{ .Values.scheduler.service.type | default "ClusterIP" }}
  selector:
    {{- include "coding-agent-automation.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  ports:
    - port: {{ .Values.scheduler.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- end }}
