{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-api
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Spec 046: api.replicas > 1 is now safe. AgentRegistryService, OrchestratorRunService, and
  # JobDeduplicationGuardService are backed by Redis when signalr.redis.connectionString is set.
  # If signalr.redis.connectionString is empty and replicas > 1, a startup warning is logged.
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: {{ .Values.api.strategy.type }}
    {{- if eq .Values.api.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.api.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.api.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "coding-agent-automation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "coding-agent-automation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "coding-agent-automation.fullname" . }}-api
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ required "api.image.tag is required" .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.service.port }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          env:
            {{- include "coding-agent-automation.commonSecretEnv" . | nindent 12 }}
            {{- include "coding-agent-automation.otelEnv" (dict "root" . "serviceName" "coding-agent-api") | nindent 12 }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.api.service.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.api.env.logLevel | quote }}
            - name: DB_LOG_LEVEL
              value: {{ .Values.api.env.dbLogLevel | quote }}
            - name: Database__Host
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: Database__Port
              value: {{ .Values.database.port | quote }}
            - name: Database__Name
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.auth.existingSecret is required" .Values.database.auth.existingSecret }}
                  key: {{ .Values.database.auth.keys.database }}
            - name: Database__Username
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.auth.existingSecret }}
                  key: {{ .Values.database.auth.keys.username }}
            - name: Database__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.auth.existingSecret }}
                  key: {{ .Values.database.auth.keys.password }}
            {{- if .Values.database.sslMode }}
            - name: Database__SslMode
              value: {{ .Values.database.sslMode | quote }}
            {{- end }}
            - name: Database__MigrateOnStartup
              value: {{ .Values.database.migrateOnStartup | toString | quote }}
            - name: LeaderElection__LeaseName
              value: "caa-{{ .Release.Name }}-api-lock"
            {{- if .Values.signalr.redis.connectionString }}
            - name: SignalR__Redis__ConnectionString
              value: {{ .Values.signalr.redis.connectionString | quote }}
            {{- end }}
            {{- include "coding-agent-automation.workDistributionEnv" . | nindent 12 }}
          volumeMounts:
            - name: job-templates
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: job-templates
          configMap:
            name: {{ include "coding-agent-automation.fullname" . }}-job-templates
            optional: true
{{- end }}
