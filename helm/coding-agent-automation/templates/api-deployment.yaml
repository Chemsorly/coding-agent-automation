{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-api
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Spec 046: api.replicas > 1 is now safe. AgentRegistryService, OrchestratorRunService, and
  # JobDeduplicationGuardService are backed by Redis when signalr.redis.connectionString is set.
  # If signalr.redis.connectionString is empty and replicas > 1, a startup warning is logged.
  replicas: {{ .Values.api.replicas }}
  # RollingUpdate is safe after Spec 046. signalr.redis.connectionString must be set for
  # multi-replica deployments to avoid divergent in-memory state between old and new pods
  # during the rollout overlap window.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "coding-agent-automation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "coding-agent-automation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "coding-agent-automation.fullname" . }}-api
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ required "api.image.tag is required" .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.service.port }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.api.service.port }}"
            {{- include "coding-agent-automation.secretEnv" . | nindent 12 }}
            {{- include "coding-agent-automation.otelEnv" (dict "serviceName" "coding-agent-api" "root" .) | nindent 12 }}
            - name: LOG_LEVEL
              value: {{ .Values.api.env.logLevel | default "Information" | quote }}
            - name: DB_LOG_LEVEL
              value: {{ .Values.api.env.dbLogLevel | default "Warning" | quote }}
            - name: Database__Host
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: Database__Port
              value: {{ .Values.database.port | default 5432 | quote }}
            - name: Database__Name
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.auth.existingSecret is required" .Values.database.auth.existingSecret }}
                  key: {{ .Values.database.auth.keys.database | default "POSTGRES_DB" }}
            - name: Database__Username
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.auth.existingSecret }}
                  key: {{ .Values.database.auth.keys.username | default "POSTGRES_USER" }}
            - name: Database__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.auth.existingSecret }}
                  key: {{ .Values.database.auth.keys.password | default "POSTGRES_PASSWORD" }}
            {{- if .Values.database.sslMode }}
            - name: Database__SslMode
              value: {{ .Values.database.sslMode | quote }}
            {{- end }}
            # API applies migrations when Database.migrateOnStartup is true (default).
            # Set to false only when running migrations externally (blue/green deployments).
            - name: Database__MigrateOnStartup
              value: {{ .Values.database.migrateOnStartup | toString | quote }}
            {{- include "coding-agent-automation.signalrEnv" . | nindent 12 }}
            # WorkDistribution env vars — required by DispatchServiceOptionsFactory.Create(),
            # consumed by ModelFetchJobService and ConsolidationWorkItemDispatchService (Req 9.3c).
            # Without these the factory returns empty OrchestratorUrl / ServiceAccount, and
            # JobSpecBuilder emits a Job spec the K8s admission webhook rejects.
            # ORCHESTRATOR_URL handed to the consolidation and model-fetch agent pods dispatched
            # from this process. Must be the Pipeline API, not the orchestrator.
            {{- include "coding-agent-automation.workDistributionEnv" . | nindent 12 }}
          volumeMounts:
            - name: job-templates
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: job-templates
          configMap:
            name: {{ include "coding-agent-automation.fullname" . }}-job-templates
            optional: true
{{- end }}
