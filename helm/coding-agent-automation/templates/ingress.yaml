{{- /* Web component values, with back-compat: legacy `orchestrator.*` overrides win over `web.*` defaults. */ -}}
{{- $web := mergeOverwrite (deepCopy (.Values.web | default dict)) (.Values.orchestrator | default dict) -}}
{{- if $web.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-web
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
  {{- with $web.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $web.ingress.className }}
  ingressClassName: {{ $web.ingress.className }}
  {{- end }}
  {{- if $web.ingress.tls }}
  tls:
    {{- range $web.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $web.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "coding-agent-automation.fullname" $ }}-web
                port:
                  number: {{ $web.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
