{{- $web := .Values.web -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-web-env
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.otel.protocol | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.webServiceName | default "coding-agent-web" | quote }}
  # OTEL_RESOURCE_ATTRIBUTES is NOT set here — it is set as an inline env: entry in web-deployment.yaml
  # using Kubernetes $(VAR_NAME) substitution to compose k8s.namespace.name and k8s.pod.name from
  # the Downward API (fieldRef). ConfigMap data cannot use fieldRef, so the composed value lives in
  # the pod spec where valueFrom entries are available.
  READINESS_DRAIN_DELAY_SECONDS: {{ $web.env.readinessDrainDelaySeconds | quote }}
  LOG_LEVEL: {{ $web.env.logLevel | quote }}
  Faro__CollectorUrl: {{ $web.env.faroCollectorUrl | quote }}
  WebUI__BasePath: {{ $web.env.basePath | default "./" | quote }}
  # Only an ingress with a tls section has an HTTPS URL to redirect to.
  WebUI__HttpsRedirect: {{ if and $web.ingress.enabled $web.ingress.tls $web.ingress.httpsRedirect }}"true"{{ else }}"false"{{ end }}
  # The only work-distribution setting the web host reads: Agent Chat waits this long for the
  # chat pod to connect. The other WorkDistribution__* keys belong to the API, Scheduler and
  # Job Controller, which build and reconcile the Jobs.
  WorkDistribution__Dispatch__ChatPodConnectTimeoutSeconds: {{ .Values.workDistribution.dispatch.chatPodConnectTimeoutSeconds | quote }}
