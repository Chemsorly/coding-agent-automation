{{- /* Web component values, with back-compat: legacy `orchestrator.*` overrides win over `web.*` defaults. */ -}}
{{- $web := mergeOverwrite (deepCopy (.Values.web | default dict)) (.Values.orchestrator | default dict) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-web-env
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.otel.protocol | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.webServiceName | default .Values.otel.orchestratorServiceName | default "coding-agent-web" | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.otel.resourceAttributes | quote }}
  PIPELINE_LOOP_STARTUP_DELAY_SECONDS: {{ $web.env.pipelineLoopStartupDelaySeconds | quote }}
  READINESS_DRAIN_DELAY_SECONDS: {{ $web.env.readinessDrainDelaySeconds | quote }}
  LOG_LEVEL: {{ $web.env.logLevel | quote }}
  Faro__CollectorUrl: {{ $web.env.faroCollectorUrl | quote }}
  WebUI__BasePath: {{ $web.env.basePath | default "./" | quote }}
  # LeaderElection__Namespace is injected as a direct env var (fieldRef) in the deployment —
  # it cannot be set here in a ConfigMap as fieldRef is not available in ConfigMap data.
  # WorkDistribution env vars — used by ChatJobDispatcher and KubernetesJobCleanup.
  # Namespace is a literal release namespace (fieldRef is not available in ConfigMaps).
  {{- include "coding-agent-automation.workDistributionConfigMapData" . | nindent 2 }}
