{{- if .Values.api.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-api
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-api
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
# Rules added in Spec 043: batch/jobs, pods, configmaps
# (for ModelFetchJobService + ConsolidationWorkItemDispatchService moved into the API).
# 042 Req 9.4 specified empty rules — this spec reverses that. Do not narrow back to empty.
# 044 adds ChatJobDispatcher to the API, which also needs batch/jobs.
rules:
  # Job management for model fetch and consolidation dispatch
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Pod status checks (startup failure detection for dispatched agent pods)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # job-templates ConfigMap read (JobTemplateStore)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # Lease-based leader election for DatabaseMaintenanceService (Spec 045 Task 8a.1, Req 1.3c).
  # Gates the retention sweep so only one API replica sweeps at a time during RollingUpdate overlaps.
  # Confirmed in 043 Req 9.3b: API already has batch/jobs; leases added here for 045.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-api
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: {{ include "coding-agent-automation.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: {{ include "coding-agent-automation.fullname" . }}-api
{{- end }}
