{{- if .Values.api.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-api
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-api
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
# Rules added in Spec 043: batch/jobs, pods, configmaps
# (for ModelFetchJobService + ChatJobDispatcher moved into the API).
# 042 Req 9.4 specified empty rules — this spec reverses that. Do not narrow back to empty.
# 044 adds ChatJobDispatcher to the API, which also needs batch/jobs.
# Spec 049: ConsolidationWorkItemDispatchService moved to JobController — batch/jobs verbs
# stay here for ModelFetchJobService and ChatJobDispatcher.
rules:
  # Job management for model fetch and consolidation dispatch
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Per-job derived-key Secrets (created before agent pod starts, owner-referenced to job)
  # Namespace isolation required: this grants create/delete on ALL secrets in the namespace.
  # K8s Role resourceNames cannot use wildcards for dynamic job secret names (caa-agent-key-*).
  # This is safe only when the coding-agent namespace is dedicated — do not deploy into a shared
  # namespace without additional network policies to prevent lateral movement.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  # Pod status checks (startup failure detection for dispatched agent pods)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # job-templates ConfigMap read (JobTemplateStore)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-api
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: {{ include "coding-agent-automation.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: {{ include "coding-agent-automation.fullname" . }}-api
{{- end }}
