{{- if and (not .Values.existingSecret) (not .Values.secrets.agentApiKey) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-secret-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    # before-hook-creation: delete any prior SA before re-running (prevents naming conflict
    # if the previous hook run left the SA behind due to a partial failure).
    # hook-succeeded: delete the SA after successful hook execution (satisfies the requirement
    # that the dedicated hook ServiceAccount MUST be deleted after hook execution — a lingering
    # SA with secret-create permission in the namespace is a principle-of-least-privilege violation
    # even after the Job completes).
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    # HookSucceeded ensures ArgoCD also deletes the SA after a successful PreSync run.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-secret-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-init
rules:
  # get is restricted to the specific Secret this hook manages (idempotency check)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "coding-agent-automation.fullname" . }}"]
    verbs: ["get"]
  # create cannot be restricted by resourceNames — K8s silently ignores resourceNames for
  # create verbs. This is a documented K8s limitation; the same pattern is used in
  # api-rbac.yaml and jobcontroller-rbac.yaml for per-Job derived-key secrets.
  # TODO [WARNING]: The Role grants namespace-wide secret-create permission due to this K8s
  # limitation. The blast radius is: any workload that can impersonate or mount this SA could
  # create arbitrary Secrets in the release namespace. The hook-succeeded delete policy above
  # mitigates this by ensuring the SA (and thus this Role/RoleBinding) is deleted after successful
  # execution. If the hook fails and leaves the SA behind, the before-hook-creation policy cleans
  # it up on the next helm upgrade. The risk window (SA exists with create permission but Job is
  # not running) is bounded to the hook execution phase.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-secret-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-init
subjects:
  - kind: ServiceAccount
    name: {{ include "coding-agent-automation.fullname" . }}-secret-init
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "coding-agent-automation.fullname" . }}-secret-init
  apiGroup: rbac.authorization.k8s.io
{{- end }}
