{{- if and (not .Values.existingSecret) (not .Values.secrets.agentApiKey) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-secret-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # before-hook-creation: delete any prior failed Job before re-running (prevents stuck state
    # if a previous attempt failed, e.g. RBAC misconfiguration — without this the next helm
    # upgrade would conflict on the existing failed Job and permanently block the release).
    # hook-succeeded: clean up on success to avoid namespace clutter.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    # ArgoCD does NOT auto-translate helm.sh/hook annotations — explicit ArgoCD annotations are
    # required so the Job runs in the PreSync phase before Deployments are created.
    argocd.argoproj.io/hook: PreSync
    # TODO [WARNING]: argocd hook-delete-policy is BeforeHookCreation only — unlike the Helm path
    # (hook-succeeded cleans up on success) and the RBAC resources (BeforeHookCreation,HookSucceeded),
    # this Job will NOT be deleted by ArgoCD after a successful PreSync. It lingers until the next
    # sync triggers the BeforeHookCreation cleanup. Add HookSucceeded here for parity:
    #   argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-init
spec:
  # Bound the failure window: a stuck image pull (air-gapped cluster, registry.k8s.io blocked)
  # would otherwise freeze `helm install` indefinitely since pre-install hooks block until
  # they complete or fail. After this deadline the Job fails with a clear error.
  activeDeadlineSeconds: {{ .Values.secretInit.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "coding-agent-automation.labels" . | nindent 8 }}
        app.kubernetes.io/component: secret-init
    spec:
      serviceAccountName: {{ include "coding-agent-automation.fullname" . }}-secret-init
      restartPolicy: OnFailure
      containers:
        - name: init
          # TODO [WARNING]: The default tag (v1.32.0) is a semver tag, not a digest — mutable tags
          # mean the image pulled at install time could differ from the image at upgrade time if the
          # tag is ever re-pushed. The values.yaml comment recommends overriding with a digest-pinned
          # reference (registry.k8s.io/kubectl@sha256:<digest>) for production, but the default ships
          # with a mutable tag. Operators who do not read the comment will silently run with a mutable
          # image. Consider changing the default tag to a digest or making the documentation more prominent.
          # TODO [WARNING] (security): imagePullPolicy: IfNotPresent combined with this mutable semver
          # tag means a cached image on a node will NOT be re-pulled on upgrade, so the image actually
          # executed is not guaranteed consistent across nodes or upgrade cycles. This is a supply-chain
          # integrity concern for the key-generation Job. Override secretInit.image.tag with a digest
          # (registry.k8s.io/kubectl@sha256:<digest>) for production deployments.
          image: "{{ .Values.secretInit.image.repository }}:{{ .Values.secretInit.image.tag }}"
          imagePullPolicy: IfNotPresent
          resources:
            {{- toYaml .Values.secretInit.resources | nindent 12 }}
          command:
            - /bin/sh
            - -c
            # TODO [WARNING]: otel-headers and opencode-config-content are hardcoded to ""
            # here, ignoring .Values.secrets.otelHeaders and .Values.secrets.opencodeConfigContent.
            # If an operator sets e.g. --set secrets.otelHeaders="Api-Token dt0c01.xxx" while
            # leaving agentApiKey empty (to use auto-generation), the hook-created Secret will
            # have an empty otel-headers value and OTEL_EXPORTER_OTLP_HEADERS will be silently
            # empty, breaking telemetry auth. The two Secret-creation paths (explicit-key via
            # secrets.yaml and auto-generation via this Job) diverge in behavior for these fields.
            # Consider templating these values from .Values.secrets.otelHeaders and
            # .Values.secrets.opencodeConfigContent into the kubectl create command.
            - |
              kubectl get secret {{ include "coding-agent-automation.secretName" . }} \
                -n {{ .Release.Namespace }} > /dev/null 2>&1 \
              || kubectl create secret generic {{ include "coding-agent-automation.secretName" . }} \
                --from-literal=agent-api-key="$(openssl rand -hex 32)" \
                --from-literal=otel-headers="" \
                --from-literal=opencode-config-content="" \
                -n {{ .Release.Namespace }}
{{- end }}
