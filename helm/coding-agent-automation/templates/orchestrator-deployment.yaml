{{- include "coding-agent-automation.deprecations" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-orchestrator
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
  {{- with .Values.orchestrator.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  strategy:
    type: {{ .Values.orchestrator.strategy.type }}
    {{- if eq .Values.orchestrator.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.orchestrator.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.orchestrator.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "coding-agent-automation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "coding-agent-automation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/orchestrator-env-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "coding-agent-automation.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.orchestrator.terminationGracePeriodSeconds }}
      {{- with .Values.orchestrator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: "{{ .Values.orchestrator.image.repository }}:{{ required "orchestrator.image.tag is required" .Values.orchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ .Values.orchestrator.probes.startup.path }}
              port: {{ .Values.orchestrator.probes.startup.port }}
            initialDelaySeconds: {{ .Values.orchestrator.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.orchestrator.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.orchestrator.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.orchestrator.probes.liveness.path }}
              port: {{ .Values.orchestrator.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.orchestrator.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orchestrator.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.orchestrator.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.orchestrator.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.orchestrator.probes.readiness.path }}
              port: {{ .Values.orchestrator.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.orchestrator.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orchestrator.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.orchestrator.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.orchestrator.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "coding-agent-automation.fullname" . }}-orchestrator-env
          env:
            {{- include "coding-agent-automation.commonSecretEnv" . | nindent 12 }}
            {{- if .Values.signalr.redis.connectionString }}
            - name: SignalR__Redis__ConnectionString
              value: {{ .Values.signalr.redis.connectionString | quote }}
            {{- end }}
            - name: PipelineApi__BaseUrl
              value: {{ include "coding-agent-automation.apiBaseUrl" . | quote }}
            - name: PipelineApi__HubUrl
              value: {{ if .Values.api.hubUrl -}}
                {{- .Values.api.hubUrl | quote }}
              {{- else -}}
                {{- printf "%s/hubs/agent" (include "coding-agent-automation.apiBaseUrl" .) | quote }}
              {{- end }}
            - name: SchedulerApi__BaseUrl
              value: {{ if .Values.scheduler.baseUrl -}}
                {{- .Values.scheduler.baseUrl | quote }}
              {{- else -}}
                {{- printf "http://%s-scheduler.%s.svc.cluster.local:%d" (include "coding-agent-automation.fullname" .) .Release.Namespace (.Values.scheduler.service.port | int) | quote }}
              {{- end }}
            - name: LeaderElection__PipelineLoopLeaseName
              value: {{ if .Values.orchestrator.leaderElection.pipelineLoopLeaseName -}}
                {{- .Values.orchestrator.leaderElection.pipelineLoopLeaseName | quote }}
              {{- else -}}
                {{- printf "caa-%s-pipeline-loop-lock" .Release.Name | quote }}
              {{- end }}
          volumeMounts:
            - name: job-templates
              mountPath: /app/config/job-templates.yaml
              subPath: job-templates.yaml
              readOnly: true
      volumes:
        - name: job-templates
          configMap:
            name: {{ include "coding-agent-automation.fullname" . }}-job-templates
            optional: true
