{{- if not .Values.existingSecret }}
{{- if .Values.secrets.agentApiKey }}
{{/*
  Explicit-key path: operator supplied secrets.agentApiKey — render a Helm-managed Secret
  with the provided key. The auto-generation hook Job is suppressed on this path (see
  secret-init-job.yaml guard). Both paths converge on the same Secret name so that
  secretEnv / secretName helpers resolve identically regardless of which path created the Secret.

  TODO [WARNING]: When secrets.agentApiKey is unset (auto-generation path), this block is skipped
  and the Secret is created solely by the pre-install/pre-upgrade hook Job (kubectl create).
  The hook-created Secret is not owned by Helm (no helm.sh/release-name annotation), so Helm
  will not attempt to manage or overwrite it on upgrade — the resource-policy: keep annotation
  on this block's Secret prevents deletion on helm uninstall, but the hook-created Secret has
  no such annotation. If this distinction ever causes a drift in resource-policy coverage between
  the two paths, operators should be aware that on the auto-generation path only the hook owns
  the Secret. See secret-init-job.yaml for the hook implementation.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
type: Opaque
stringData:
  agent-api-key: {{ .Values.secrets.agentApiKey | quote }}
  otel-headers: {{ .Values.secrets.otelHeaders | quote }}
  opencode-config-content: {{ .Values.secrets.opencodeConfigContent | quote }}
{{- else }}
{{/*
  Auto-generation path: secrets.agentApiKey is empty — the pre-install/pre-upgrade hook Job
  (secret-init-job.yaml) creates the Secret via `kubectl create` with a CSPRNG-generated key.
  No Helm-managed Secret is rendered here to avoid an ownership collision: the hook runs before
  main resources, so if Helm attempted to apply a Secret with the same name it would fail with
  "exists and cannot be imported into the current release: invalid ownership metadata" because
  the hook-created Secret has no Helm ownership annotations.

  TODO [WARNING]: The hook-created Secret does not carry the `helm.sh/resource-policy: keep`
  annotation (it is created by kubectl, not Helm). On `helm uninstall` Helm will not attempt
  to delete it (it does not own it), so functionally the key is preserved — but only because
  Helm doesn't know about the resource, not because of an explicit keep annotation. This is
  safe in practice but is a subtle distinction from the explicit-key path above. If a future
  Helm version changes how unmanaged resources are handled, revisit this assumption.

  TODO [WARNING]: On an upgrade where the operator transitions from the auto-generation path
  (secrets.agentApiKey: "") to the explicit-key path (secrets.agentApiKey: "mykey"), Helm will
  apply this Secret block for the first time. Since the existing Secret (created by the hook)
  lacks Helm ownership annotations, Helm may reject the apply. Operators making this transition
  should manually delete the hook-created Secret before upgrading, or use kubectl to patch the
  ownership annotations onto it first.
*/}}
{{- end }}
{{- end }}
