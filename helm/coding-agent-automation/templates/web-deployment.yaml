{{- include "coding-agent-automation.deprecations" . }}
{{- /* Web component values, with back-compat: legacy `orchestrator.*` overrides win over `web.*` defaults. Prefer `web.*` in new values. */ -}}
{{- $web := mergeOverwrite (deepCopy (.Values.web | default dict)) (.Values.orchestrator | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coding-agent-automation.fullname" . }}-web
  labels:
    {{- include "coding-agent-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with $web.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $web.replicas }}
  strategy:
    type: {{ $web.strategy.type }}
    {{- if eq $web.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ $web.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ $web.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "coding-agent-automation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "coding-agent-automation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "coding-agent-automation.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ $web.terminationGracePeriodSeconds }}
      {{- with $web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $web.affinity }}
      affinity:
        {{- toYaml $web.affinity | nindent 8 }}
      {{- else if gt (int $web.replicas) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "coding-agent-automation.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: web
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with $web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $web.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ $web.image.repository }}:{{ $web.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $web.service.port }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: {{ $web.probes.startup.path }}
              port: {{ $web.probes.startup.port }}
            periodSeconds: {{ $web.probes.startup.periodSeconds }}
            failureThreshold: {{ $web.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $web.probes.liveness.path }}
              port: {{ $web.probes.liveness.port }}
            initialDelaySeconds: {{ $web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $web.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $web.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $web.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $web.probes.readiness.path }}
              port: {{ $web.probes.readiness.port }}
            initialDelaySeconds: {{ $web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $web.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $web.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $web.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml $web.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "coding-agent-automation.fullname" . }}-web-env
          env:
            {{- include "coding-agent-automation.secretEnv" . | nindent 12 }}
            # KubernetesWorkDistributor and KubernetesJobCleanup have been migrated to
            # IPipelineApiWorkItemClient. IPipelineRunHistoryService, IConsolidationRunStore,
            # IHarnessSuggestionStore, and IWorkItemFallbackTransitionService are all API-backed
            # as of arch-audit 2026-08-22 (T8 complete). The web no longer holds a
            # Postgres connection. Database env vars removed.
            {{- include "coding-agent-automation.signalrEnv" . | nindent 12 }}
            # Pipeline API connection — required by IPipelineApiConfigClient and IAgentHubConnection.
            # Spec 045 Req 6.4: web must know API base URL and hub URL.
            - name: PipelineApi__BaseUrl
              value: {{ include "coding-agent-automation.apiBaseUrl" . | quote }}
            - name: PipelineApi__HubUrl
              value: {{ if .Values.api.hubUrl -}}
                {{- .Values.api.hubUrl | quote }}
              {{- else -}}
                {{- printf "%s/hubs/agent" (include "coding-agent-automation.apiBaseUrl" .) | quote }}
              {{- end }}
            # Scheduler API URL — used by LoopStatusPollingService and scheduler loop controls.
            # Defaults to the in-cluster scheduler service URL. Override via scheduler.baseUrl
            # when the Scheduler is deployed externally or scheduler.enabled is false.
            - name: SchedulerApi__BaseUrl
              value: {{ if .Values.scheduler.baseUrl -}}
                {{- .Values.scheduler.baseUrl | quote }}
              {{- else -}}
                {{- printf "http://%s-scheduler.%s.svc.cluster.local:%d" (include "coding-agent-automation.fullname" .) .Release.Namespace (.Values.scheduler.service.port | int) | quote }}
              {{- end }}
            # Leader election lease name — release-scoped to prevent collision when multiple
            # Helm releases share a namespace (Req 6.3/6.7). Overridable via values.yaml.
            - name: LeaderElection__PipelineLoopLeaseName
              value: {{ include "coding-agent-automation.leaseName" (dict "override" $web.leaderElection.pipelineLoopLeaseName "suffix" "pipeline-loop-lock" "root" .) }}
            - name: LeaderElection__Namespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: job-templates
              mountPath: /app/config/job-templates.yaml
              subPath: job-templates.yaml
              readOnly: true
      volumes:
        - name: job-templates
          configMap:
            name: {{ include "coding-agent-automation.fullname" . }}-job-templates
            optional: true